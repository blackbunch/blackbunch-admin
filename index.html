<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <title>블랙번치 스튜디오 일정 관리 시스템</title>

  <link rel="shortcut icon" href="#">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/main.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <link rel="stylesheet" href="./style.css">
</head>
<body>

<div id="loginView" class="login-container">
  <div class="text-center mb-4">
    <h3 class="fw-bold text-white mb-2">🎵 블랙번치 스튜디오</h3>
    <p class="text-secondary small mb-0">일정 관리 시스템 로그인</p>
  </div>
  <form onsubmit="event.preventDefault(); handleLogin();">
    <div class="mb-3">
      <label class="form-label font-weight-bold">아이디</label>
      <input type="text" id="loginEmail" class="form-control" placeholder="아이디를 입력하세요" required>
    </div>
    <div class="mb-4">
      <label class="form-label font-weight-bold">비밀번호</label>
      <input type="password" id="loginPassword" class="form-control" placeholder="비밀번호를 입력하세요" required>
    </div>
    <button type="submit" id="loginBtn" class="btn btn-primary w-100 py-2">로그인</button>
  </form>
</div>

<div id="mainApp" class="main-container d-none">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
    <h4 class="fw-bold m-0">🎵 블랙번치 스튜디오 스케줄</h4>
    <div id="authContainer" class="d-flex align-items-center gap-2">
      <button id="manageCoachBtn" class="btn btn-outline-light btn-sm d-none" style="border-radius:8px;" data-bs-toggle="modal" data-bs-target="#coachModal">
        ⚙️ 코치 관리
      </button>
      <button id="scheduleHistoryBtn" class="btn btn-outline-info btn-sm d-none" style="border-radius:8px;" onclick="openScheduleHistory()">
        📝 변경 이력
      </button>
      <button id="installAppBtn" class="btn btn-sm btn-outline-light" onclick="installPwaApp()">앱 설치</button>
      <span id="userInfo" class="fw-bold small text-secondary"></span>
      <button id="authBtn" class="btn btn-sm btn-outline-danger" style="border-radius:8px;" onclick="handleLogout()">로그아웃</button>
    </div>
  </div>

  <div class="schedule-type-nav">
    <button id="tabLesson" class="schedule-type-btn active" onclick="switchScheduleType('lesson')">
      🎵 레슨 스케줄
    </button>
    <button id="tabConsulting" class="schedule-type-btn consulting-tab" onclick="switchScheduleType('consulting')">
      📋 상담 스케줄
    </button>
    <button id="tabPractice" class="schedule-type-btn practice-tab" onclick="switchScheduleType('practice')">
      🎹 연습실 대여
    </button>
  </div>

  <div class="unassigned-container">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
      <div class="d-flex align-items-center gap-3">
        <h6 id="unassignedTitle" class="fw-bold text-warning m-0">⏳ 1단계: 레슨생 정보 등록 (미정 목록)</h6>
        <div class="d-flex align-items-center gap-1" id="coachFilterWrapper">
          <label class="text-secondary small mb-0 text-nowrap" style="font-size: 0.8rem;">코치 필터:</label>
          <select id="unassignedCoachFilter" class="form-select form-select-sm py-0 px-2" style="font-size:0.8rem; height:28px;" onchange="renderUnassignedList()">
            <option value="ALL">전체 보기</option>
          </select>
        </div>
      </div>
      <button id="unassignedAddBtn" class="btn btn-sm btn-outline-warning" style="border-radius:6px; font-size:0.8rem;" onclick="toggleUnassignedForm()">+ 미정 레슨생 등록</button>
    </div>

    <div id="lessonStatusTabs" class="d-flex gap-2 mb-3">
      <button id="pendingStatusBtn" class="btn btn-sm btn-warning" onclick="switchUnassignedStatus('pending')">미정 레슨생</button>
      <button id="onHoldStatusBtn" class="btn btn-sm btn-outline-secondary" onclick="switchUnassignedStatus('on_hold')">장기거치</button>
    </div>

    <div id="unassignedForm" class="p-3 bg-dark rounded border border-secondary mb-3 d-none">
      <div class="row g-2">
        <div class="col-6 col-md-2">
          <label class="form-label small">지점</label>
          <select id="unBranch" class="form-select form-select-sm" onchange="updateRoomOptionsForUnassigned()">
            <option value="위례점" selected>위례점</option>
            <option value="미사점">미사점</option>
            <option value="다산점">다산점</option>
          </select>
        </div>
        <div class="col-6 col-md-2">
          <label id="unNameLabel" class="form-label small">수강생/이용자 이름</label>
          <input type="text" id="unStudentName" class="form-control form-control-sm" placeholder="성함 입력">
        </div>
        <div class="col-6 col-md-2 consulting-only-field practice-field d-none">
          <label id="unContactLabel" class="form-label small">연락처</label>
          <input type="text" id="unPhone" class="form-control form-control-sm" placeholder="010-0000-0000">
        </div>
        <div class="col-6 col-md-2 lesson-only-field">
          <label class="form-label small">총 회차</label>
          <select id="unSessions" class="form-select form-select-sm" onchange="updateStartSessionOptions()">
            <option value="1">1회 (원데이)</option>
            <option value="2">2회</option>
            <option value="3">3회</option>
            <option value="4" selected>4회 (1개월 기본)</option>
            <option value="8">8회 (2개월)</option>
            <option value="12">12회 (3개월)</option>
            <option value="16">16회 (4개월)</option>
            <option value="20">20회 (5개월)</option>
            <option value="24">24회 (6개월)</option>
          </select>
        </div>
        <div class="col-6 col-md-2 lesson-only-field">
          <label class="form-label small">시작 회차</label>
          <select id="unStartSession" class="form-select form-select-sm"></select>
        </div>
        <div class="col-6 col-md-2 lesson-only-field">
          <label class="form-label small">일정 상태</label>
          <select id="unManagementStatus" class="form-select form-select-sm" onchange="toggleHoldFields()">
            <option value="pending" selected>미정</option>
            <option value="on_hold">장기거치</option>
          </select>
        </div>
        <div id="holdDetails" class="row g-2 lesson-only-field d-none">
          <div class="col-6 col-md-3">
            <label class="form-label small">거치 사유</label>
            <input type="text" id="unHoldReason" class="form-control form-control-sm" placeholder="예: 개인 사정">
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label small">재개 예정일</label>
            <input type="date" id="unResumeDate" class="form-control form-control-sm">
          </div>
        </div>
        <div class="col-6 col-md-2 coach-field">
          <label class="form-label small">담당 코치</label>
          <select id="unCoachName" class="form-select form-select-sm"></select>
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label small">구분 / 이용 시간</label>
          <select id="unSubject" class="form-select form-select-sm"></select>
        </div>
        <div class="col-6 col-md-2 room-field">
          <label class="form-label small">이용 룸</label>
          <select id="unRoomName" class="form-select form-select-sm"></select>
        </div>
        <div class="col-12 text-end mt-2">
          <button class="btn btn-sm btn-warning" style="border-radius:6px;" onclick="addUnassignedStudent()">미정 목록에 저장</button>
        </div>
      </div>
    </div>

    <div id="unassignedList"></div>
  </div>

  <div class="filter-section">
    <div class="row g-2 align-items-center">
      <div class="col-6 col-md-3">
        <label for="branchSelect" class="form-label fw-bold">📍 지점 선택</label>
        <select id="branchSelect" class="form-select" onchange="handleBranchChange()">
          <option value="위례점" selected>위례점</option>
          <option value="미사점">미사점</option>
          <option value="다산점">다산점</option>
        </select>
      </div>
      <div class="col-6 col-md-3 room-field">
        <label for="roomSelect" class="form-label fw-bold">🚪 룸/연습실 필터</label>
        <select id="roomSelect" class="form-select" onchange="calendar && calendar.refetchEvents()"></select>
      </div>
      <div class="col-6 col-md-3 coach-field">
        <label for="coachFilter" class="form-label fw-bold">🎤 코치 필터</label>
        <select id="coachFilter" class="form-select" onchange="calendar && calendar.refetchEvents()">
          <option value="ALL" selected>전체 코치 보기</option>
        </select>
      </div>
      <div class="col-6 col-md-3">
        <label for="calendarDatePicker" class="form-label fw-bold">📅 날짜 이동</label>
        <input type="date" id="calendarDatePicker" class="form-control" onchange="goToCalendarDate(this.value)">
      </div>
      <div class="col-6 col-md-3 pt-md-3">
        <button id="addScheduleBtn" class="btn btn-primary w-100" onclick="openAddModal()">
          + 일정 직접 추가
        </button>
      </div>
    </div>
  </div>

  <div id="calendar"></div>
  <div id="coachMobileSchedule" class="coach-mobile-schedule">
    <div class="coach-mobile-date-nav">
      <button class="btn btn-sm btn-outline-light" onclick="changeCoachMobileDate(-1)">‹</button>
      <button id="coachMobileDateTitle" class="coach-mobile-date-title btn btn-sm btn-outline-light" onclick="goToCoachMobileToday()">오늘</button>
      <button class="btn btn-sm btn-outline-light" onclick="changeCoachMobileDate(1)">›</button>
    </div>
    <select id="coachMobileBranchFilter" class="form-select form-select-sm coach-mobile-branch-filter" onchange="renderCoachMobileSchedule()"></select>
    <div id="coachMobileScheduleList"></div>
    <button class="btn btn-primary coach-mobile-add" onclick="openAddModal()">+ 일정 추가</button>
  </div>
</div>

<div class="modal fade" id="scheduleModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="modalTitle">일정 추가</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="scheduleForm">
          <input type="hidden" id="scheduleId">
          <input type="hidden" id="currentUnassignedDbId">
          <input type="hidden" id="modalTotalSessions" value="4">
          <input type="hidden" id="modalSessionNo" value="1">
          <input type="hidden" id="recurrenceGroupId">
          
          <div class="mb-3">
            <label class="form-label">지점</label>
            <select id="modalBranch" class="form-select" required onchange="updateRoomOptionsForModal()">
              <option value="위례점">위례점</option>
              <option value="미사점">미사점</option>
              <option value="다산점">다산점</option>
            </select>
          </div>

          <div class="mb-3">
            <label id="modalNameLabel" class="form-label">이름</label>
            <input type="text" id="modalStudentName" class="form-control" placeholder="성함 입력" required>
          </div>

          <div id="consultPhoneGroup" class="mb-3 consulting-only-field practice-field d-none">
            <label id="modalContactLabel" class="form-label">연락처</label>
            <input type="text" id="modalPhone" class="form-control" placeholder="010-0000-0000">
          </div>

          <div class="mb-3 coach-field" id="coachSelectGroup">
            <label class="form-label">담당 코치</label>
            <select id="modalCoachName" class="form-select"></select>
          </div>

          <div class="mb-3">
            <label class="form-label" id="modalSubjectLabel">과목 / 레슨 구분</label>
            <select id="modalSubject" class="form-select" required onchange="populateTimeOptions(); calculateEndTime()"></select>
          </div>

          <div id="consultStatusGroup" class="mb-3 d-none">
            <label class="form-label">상담 진행 상태</label>
            <select id="modalConsultStatus" class="form-select">
              <option value="예약완료" selected>📅 예약완료</option>
              <option value="상담완료(등록)">✅ 상담완료 (등록 완료)</option>
              <option value="상담완료(미등록)">💬 상담완료 (미등록)</option>
              <option value="취소">❌ 취소</option>
            </select>
          </div>

          <div class="mb-3 room-field" id="roomSelectGroup">
            <label class="form-label">방 번호(룸 / 연습실)</label>
            <select id="modalRoomName" class="form-select"></select>
          </div>

          <div class="mb-3">
            <label class="form-label">날짜</label>
            <input type="date" id="modalDate" class="form-control" required>
          </div>

          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label">시작 시간</label>
              <input type="time" id="modalStartTime" class="form-control" required inputmode="numeric" min="10:00" max="22:50" step="1800" onchange="calculateEndTime()">
            </div>
            <div class="col-6 mb-3">
              <label class="form-label">종료 시간</label>
              <input type="time" id="modalEndTime" class="form-control" required>
            </div>
          </div>

          <div id="consultMemoGroup" class="mb-3 consulting-only-field practice-field d-none">
            <label class="form-label">특이사항 / 메모</label>
            <textarea id="modalMemo" class="form-control" rows="2" placeholder="전화번호, 기타 특이사항 입력"></textarea>
          </div>

          <div id="lessonAttendanceGroup" class="mb-3 lesson-only-field">
            <label class="form-label">수업 상태</label>
            <select id="modalScheduleStatus" class="form-select">
              <option value="scheduled" selected>일반 수업</option>
              <option value="makeup">🔁 보강</option>
            </select>
          </div>

          <div id="repeatSection" class="p-3 bg-dark border border-secondary rounded mb-3 lesson-only-field">
            <div class="form-check form-switch mb-0">
              <input class="form-check-input" type="checkbox" id="repeatScheduleCheck" onchange="toggleRepeatOptions()">
              <label class="form-check-label fw-bold text-warning small" for="repeatScheduleCheck">
                🔁 주마다 일정 자동 갱신/반복 (ON/OFF)
              </label>
            </div>
            <div id="repeatOptionsGroup" class="d-none mt-3 border-top border-secondary pt-2">
              <label class="form-label small text-secondary">등록할 연속 주차(남은 회차 내에서 선택):</label>
              <select id="repeatWeeksSelect" class="form-select form-select-sm"></select>
            </div>
            <div id="recurrenceEditGroup" class="d-none mt-3 border-top border-secondary pt-2">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="applyToFutureSeriesCheck">
                <label class="form-check-label small" for="applyToFutureSeriesCheck">이후 반복 회차에도 코치·룸·과목·시간 변경 적용</label>
              </div>
              <div class="form-check mt-2">
                <input class="form-check-input" type="checkbox" id="cancelFutureSeriesCheck">
                <label class="form-check-label small text-danger" for="cancelFutureSeriesCheck">취소 처리 시 이후 반복 회차도 함께 취소</label>
              </div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" id="deleteScheduleBtn" class="btn btn-danger me-auto d-none" style="border-radius:8px;" onclick="deleteSchedule()">취소 처리</button>
        <button type="button" class="btn btn-secondary" style="border-radius:8px;" data-bs-dismiss="modal">취소</button>
        <button type="button" id="saveScheduleBtn" class="btn btn-primary" onclick="saveSchedule()">스케줄 저장</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="coachModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">코치 계정 등록 및 관리</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="coachForm" class="p-3 rounded mb-4" style="background-color: #21232d; border:1px solid #2e3140;">
          <h6 class="fw-bold mb-3">➕ 새 코치 등록</h6>
          <div class="row g-3 mb-2">
            <div class="col-12">
              <label class="form-label small fw-bold">담당 지점 (중복 선택 가능)</label>
              <div class="branch-checkbox-group">
                <div class="form-check form-check-inline">
                  <input class="form-check-input new-coach-branch" type="checkbox" id="chkWirye" value="위례점" checked>
                  <label class="form-check-label small" for="chkWirye">위례점</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input new-coach-branch" type="checkbox" id="chkMisa" value="미사점">
                  <label class="form-check-label small" for="chkMisa">미사점</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input new-coach-branch" type="checkbox" id="chkDasan" value="다산점">
                  <label class="form-check-label small" for="chkDasan">다산점</label>
                </div>
              </div>
            </div>
          </div>
          <div class="row g-2">
            <div class="col-6 col-md-3">
              <label class="form-label small fw-bold">코치 이름</label>
              <input type="text" id="newCoachName" class="form-control form-control-sm" placeholder="예: 김보컬" required>
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label small fw-bold">아이디 / 이메일</label>
              <input type="text" id="newCoachEmail" class="form-control form-control-sm" placeholder="아이디 입력" required>
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label small fw-bold">비밀번호</label>
              <input type="password" id="newCoachPassword" class="form-control form-control-sm" placeholder="비밀번호 입력" required>
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label small fw-bold">권한</label>
              <select id="newCoachRole" class="form-select form-select-sm">
                <option value="coach" selected>코치</option>
                <option value="admin">관리자</option>
              </select>
            </div>
            <div class="col-12 col-md-3 mt-2">
              <label class="form-label small fw-bold">캘린더 색상</label>
              <input type="color" id="newCoachColor" class="form-control form-color-color w-100" value="#4f46e5">
            </div>
            <div class="col-12 text-end mt-3">
              <button type="button" id="saveCoachBtn" class="btn btn-sm btn-success px-4" style="border-radius:8px;" onclick="registerNewCoach()">코치 추가</button>
            </div>
          </div>
        </form>

        <h6 class="fw-bold mb-3">📋 등록된 코치 목록</h6>
        <div class="table-responsive">
          <table class="table table-bordered table-dark-custom align-middle small mb-0">
            <thead>
              <tr>
                <th>지점</th>
                <th>이름</th>
                <th>아이디</th>
                <th>권한</th>
                <th>색상</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody id="coachTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="scheduleHistoryModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">📝 코치별 일정 변경 이력</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="d-flex gap-2 align-items-center mb-3">
          <label class="form-label mb-0 text-nowrap">담당 코치</label>
          <select id="historyCoachFilter" class="form-select form-select-sm" onchange="loadScheduleHistory()">
            <option value="ALL">전체 코치</option>
          </select>
        </div>
        <div id="scheduleHistoryList" class="small text-secondary">변경 이력을 불러오는 중입니다.</div>
      </div>
