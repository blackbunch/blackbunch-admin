<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블랙번치 스튜디오 - 통합 관리 시스템</title>
  
  <!-- FullCalendar CDN -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  
  <style>
    :root {
      --bg-color: #0f0f11;
      --card-bg: #1a1a1e;
      --accent-color: #3b82f6;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --border-color: #2e2e38;
      --danger-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .top-bar h1 {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.9rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .card h2 {
      font-size: 1.15rem;
      margin-bottom: 16px;
      color: var(--text-main);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-sub);
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      background-color: #121215;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .branch-checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background-color: #121215;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text-main);
      user-select: none;
    }

    .checkbox-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #2563eb;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.85rem;
      width: auto;
      background-color: #27272a;
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-sm:hover {
      background-color: #3f3f46;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }

    th {
      color: var(--text-sub);
      font-weight: 600;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      background-color: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
      border-radius: 4px;
      font-size: 0.8rem;
      margin-right: 4px;
    }

    .btn-delete {
      background-color: transparent;
      color: var(--danger-color);
      border: 1px solid var(--danger-color);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .btn-delete:hover {
      background-color: var(--danger-color);
      color: #fff;
    }

    .hidden {
      display: none !important;
    }

    .login-container {
      max-width: 400px;
      margin: 80px auto 0;
    }

    /* 필터 바 스타일 */
    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
      background: #121215;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    /* FullCalendar 어두운 테마 커스텀 */
    #calendar {
      margin-top: 16px;
      background: #121215;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }
    .fc {
      --fc-border-color: #2e2e38;
      --fc-page-bg-color: #121215;
      --fc-neutral-bg-color: #1a1a1e;
      color: var(--text-main);
    }
    .fc .fc-toolbar-title { font-size: 1.1rem; font-weight: bold; }
    .fc .fc-button-primary { background-color: #27272a; border-color: var(--border-color); }
    .fc .fc-button-primary:hover { background-color: #3f3f46; }
    .fc .fc-button-primary:not(:disabled).fc-button-active { background-color: var(--accent-color); border-color: var(--accent-color); }

    /* 모달 팝업 스타일 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 450px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. 로그인 전 화면 -->
    <div id="loginView" class="login-container">
      <div class="card">
        <h2 style="text-align: center; margin-bottom: 20px;">BLACK BUNCH STUDIO<br><span style="font-size: 0.9rem; color: var(--text-sub); font-weight: normal;">관리 시스템 로그인</span></h2>
        <form id="loginForm">
          <div class="form-group">
            <label for="loginId">아이디</label>
            <input type="text" id="loginId" class="form-control" placeholder="아이디 입력" required>
          </div>
          <div class="form-group">
            <label for="loginPassword">비밀번호</label>
            <input type="password" id="loginPassword" class="form-control" placeholder="비밀번호 입력" required>
          </div>
          <button type="submit" class="btn">로그인</button>
        </form>
        <p style="font-size: 0.8rem; color: var(--text-sub); text-align: center; margin-top: 16px;">
          * 어드민 계정: admin / admin1234
        </p>
      </div>
    </div>

    <!-- 2. 상단 헤더 -->
    <div id="appHeader" class="top-bar hidden">
      <h1 id="pageTitle">어드민 - 통합 관리 시스템</h1>
      <div class="user-info">
        <span id="userInfoText"></span>
        <button class="btn btn-sm" onclick="logout()">로그아웃</button>
      </div>
    </div>

    <!-- 3. 어드민 전용 계정 관리 화면 -->
    <div id="adminView" class="hidden">
      <div class="card">
        <h2>신규 코치 계정 등록</h2>
        <form id="coachForm">
          <div class="form-group">
            <label for="coachId">아이디</label>
            <input type="text" id="coachId" class="form-control" placeholder="아이디 입력" required>
          </div>

          <div class="form-group">
            <label for="coachPassword">비밀번호</label>
            <input type="password" id="coachPassword" class="form-control" placeholder="비밀번호 입력" required>
          </div>

          <div class="form-group">
            <label for="coachName">코치 이름</label>
            <input type="text" id="coachName" class="form-control" placeholder="예: 연우 코치" required>
          </div>

          <div class="form-group">
            <label>담당 지점 (다중 선택 가능)</label>
            <div class="branch-checkbox-group">
              <label class="checkbox-item">
                <input type="checkbox" name="branch" value="ALL" id="branchAll" onchange="toggleSelectAll(this)">
                <strong>전체 지점 (ALL)</strong>
              </label>
              <label class="checkbox-item"><input type="checkbox" name="branch" value="미사" class="branch-item"> 미사점</label>
              <label class="checkbox-item"><input type="checkbox" name="branch" value="위례" class="branch-item"> 위례점</label>
              <label class="checkbox-item"><input type="checkbox" name="branch" value="다산" class="branch-item"> 다산점</label>
            </div>
          </div>

          <button type="submit" class="btn">코치 계정 생성</button>
        </form>
      </div>

      <div class="card">
        <h2>등록된 코치 목록</h2>
        <table>
          <thead>
            <tr>
              <th>이름</th>
              <th>아이디</th>
              <th>담당 지점</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody id="coachTableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 4. 캘린더 대시보드 (어드민 & 코치 공통) -->
    <div id="calendarView" class="hidden">
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <h2>📅 레슨 및 연습실 예약 일정</h2>
          <button class="btn btn-sm" style="background-color: var(--accent-color);" onclick="openModal()">+ 일정 등록</button>
        </div>
        
        <!-- 상세 필터 바 (지점, 과목, 룸 선택) -->
        <div class="filter-grid">
          <div>
            <label class="form-group" style="font-size:0.8rem; margin-bottom:4px;">지점 선택</label>
            <select id="filterBranch" class="form-control" onchange="applyFilters()">
              <!-- 동적 생성 -->
            </select>
          </div>
          <div>
            <label class="form-group" style="font-size:0.8rem; margin-bottom:4px;">과목 필터</label>
            <select id="filterSubject" class="form-control" onchange="applyFilters()">
              <option value="ALL">전체 과목</option>
              <option value="스타일">스타일</option>
              <option value="보컬 메이킹">보컬 메이킹</option>
              <option value="2:1 그룹">2:1 그룹</option>
              <option value="3:1 그룹">3:1 그룹</option>
              <option value="연습실">연습실 예약</option>
            </select>
          </div>
          <div>
            <label class="form-group" style="font-size:0.8rem; margin-bottom:4px;">방 목록 필터</label>
            <select id="filterRoom" class="form-control" onchange="applyFilters()">
              <option value="ALL">전체 방</option>
              <option value="1번 방">1번 방</option>
              <option value="2번 방">2번 방</option>
              <option value="3번 방">3번 방</option>
              <option value="4번 방">4번 방</option>
              <option value="연습실">연습실</option>
            </select>
          </div>
        </div>

        <!-- 캘린더 화면 -->
        <div id="calendar"></div>
      </div>
    </div>

  </div>

  <!-- 일정 등록/수정 모달 -->
  <div id="scheduleModal" class="modal-overlay hidden">
    <div class="modal-content">
      <h3 style="margin-bottom:16px;">레슨 / 연습실 일정 등록</h3>
      <form id="scheduleForm">
        <div class="form-group">
          <label>지점</label>
          <select id="modalBranch" class="form-control" required></select>
        </div>
        <div class="form-group">
          <label>과목</label>
          <select id="modalSubject" class="form-control" required>
            <option value="스타일">스타일</option>
            <option value="보컬 메이킹">보컬 메이킹</option>
            <option value="2:1 그룹">2:1 그룹</option>
            <option value="3:1 그룹">3:1 그룹</option>
            <option value="연습실">연습실 예약</option>
          </select>
        </div>
        <div class="form-group">
          <label>방 선택</label>
          <select id="modalRoom" class="form-control" required>
            <option value="1번 방">1번 방</option>
            <option value="2번 방">2번 방</option>
            <option value="3번 방">3번 방</option>
            <option value="4번 방">4번 방</option>
            <option value="연습실">연습실</option>
          </select>
        </div>
        <div class="form-group">
          <label>수강생 이름</label>
          <input type="text" id="modalStudent" class="form-control" placeholder="예: 김보컬" required>
        </div>
        <div class="form-group">
          <label>담당 코치</label>
          <input type="text" id="modalCoach" class="form-control" placeholder="예: 연우 코치" required>
        </div>
        <div class="form-group">
          <label>일시 (시작 시간)</label>
          <input type="datetime-local" id="modalStart" class="form-control" required>
        </div>
        
        <div style="display:flex; gap:8px; margin-top:20px;">
          <button type="submit" class="btn">저장하기</button>
          <button type="button" class="btn btn-sm" style="width:30%; background:#3f3f46;" onclick="closeModal()">취소</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let coachList = JSON.parse(localStorage.getItem('coachList')) || [];
    let currentUser = JSON.parse(sessionStorage.getItem('currentUser')) || null;
    let calendar = null;

    // 기본 일정 샘플 데이터
    let schedules = JSON.parse(localStorage.getItem('schedules')) || [
      { id: '1', title: '[미사/스타일/1번 방] 김수강 - 연우 코치', start: new Date().toISOString().split('T')[0] + 'T14:00', branch: '미사', subject: '스타일', room: '1번 방' },
      { id: '2', title: '[위례/보컬 메이킹/2번 방] 이수강 - 승진 코치', start: new Date().toISOString().split('T')[0] + 'T16:00', branch: '위례', subject: '보컬 메이킹', room: '2번 방' },
      { id: '3', title: '[다산/2:1 그룹/연습실] 박그룹, 최그룹', start: new Date().toISOString().split('T')[0] + 'T18:00', branch: '다산', subject: '2:1 그룹', room: '연습실' }
    ];

    window.addEventListener('DOMContentLoaded', () => {
      if (currentUser) {
        showMainView(currentUser);
      } else {
        showLoginView();
      }
    });

    // 로그인
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const id = document.getElementById('loginId').value.trim();
      const pw = document.getElementById('loginPassword').value.trim();

      if (id === 'admin' && pw === 'admin1234') {
        const adminUser = { role: 'admin', name: '어드민(원장님)', id: 'admin' };
        sessionStorage.setItem('currentUser', JSON.stringify(adminUser));
        showMainView(adminUser);
        this.reset();
        return;
      }

      const coach = coachList.find(c => c.id === id && c.password === pw);
      if (coach) {
        const coachUser = { role: 'coach', name: coach.name, id: coach.id, branches: coach.branches };
        sessionStorage.setItem('currentUser', JSON.stringify(coachUser));
        showMainView(coachUser);
        this.reset();
        return;
      }

      alert('아이디 또는 비밀번호가 불일치합니다.');
    });

    function logout() {
      sessionStorage.removeItem('currentUser');
      currentUser = null;
      showLoginView();
    }

    function showLoginView() {
      document.getElementById('loginView').classList.remove('hidden');
      document.getElementById('appHeader').classList.add('hidden');
      document.getElementById('adminView').classList.add('hidden');
      document.getElementById('calendarView').classList.add('hidden');
    }

    function showMainView(user) {
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('appHeader').classList.remove('hidden');
      document.getElementById('userInfoText').textContent = `${user.name} 님`;

      setupBranchFilter(user);

      if (user.role === 'admin') {
        document.getElementById('pageTitle').textContent = '어드민 - 통합 계정 및 레슨 관리';
        document.getElementById('adminView').classList.remove('hidden');
        document.getElementById('calendarView').classList.remove('hidden');
        renderCoachList();
      } else {
        document.getElementById('pageTitle').textContent = `${user.name} 코치 대시보드`;
        document.getElementById('adminView').classList.add('hidden');
        document.getElementById('calendarView').classList.remove('hidden');
      }

      initCalendar();
    }

    function setupBranchFilter(user) {
      const filterSelect = document.getElementById('filterBranch');
      const modalSelect = document.getElementById('modalBranch');
      filterSelect.innerHTML = '';
      modalSelect.innerHTML = '';

      let availableBranches = [];
      if (user.role === 'admin' || user.branches.includes('ALL')) {
        availableBranches = ['미사', '위례', '다산'];
        filterSelect.innerHTML += `<option value="ALL">전체 지점 보기</option>`;
      } else {
        availableBranches = user.branches.filter(b => b !== '운정');
      }

      availableBranches.forEach(b => {
        filterSelect.innerHTML += `<option value="${b}">${b}점</option>`;
        modalSelect.innerHTML += `<option value="${b}">${b}점</option>`;
      });
    }

    function initCalendar() {
      const calendarEl = document.getElementById('calendar');
      
      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek'
        },
        locale: 'ko',
        events: getFilteredEvents()
      });

      calendar.render();
    }

    function getFilteredEvents() {
      const branch = document.getElementById('filterBranch').value;
      const subject = document.getElementById('filterSubject').value;
      const room = document.getElementById('filterRoom').value;

      return schedules.filter(s => {
        const matchBranch = (branch === 'ALL' || s.branch === branch);
        const matchSubject = (subject === 'ALL' || s.subject === subject);
        const matchRoom = (room === 'ALL' || s.room === room);
        return matchBranch && matchSubject && matchRoom;
      });
    }

    function applyFilters() {
      if (calendar) {
        calendar.removeAllEvents();
        calendar.addEventSource(getFilteredEvents());
      }
    }

    function openModal() {
      document.getElementById('scheduleModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('scheduleModal').classList.add('hidden');
    }

    // 일정 추가 및 방 중복 예약 방지 검증 (Duplicate Check)
    document.getElementById('scheduleForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const branch = document.getElementById('modalBranch').value;
      const subject = document.getElementById('modalSubject').value;
      const room = document.getElementById('modalRoom').value;
      const student = document.getElementById('modalStudent').value.trim();
      const coach = document.getElementById('modalCoach').value.trim();
      const start = document.getElementById('modalStart').value;

      // 1. 방 중복 예약 검증: 같은 지점 + 같은 방 + 같은 시작 시간 여부 확인
      const isDuplicate = schedules.some(schedule => {
        return schedule.branch === branch && 
               schedule.room === room && 
               schedule.start === start;
      });

      if (isDuplicate) {
        alert(`❌ 중복 예약 오류!\n[${branch}점 - ${room}] 해당 시간에 이미 다른 예약이 존재합니다.\n다른 시간이나 방을 선택해주세요.`);
        return;
      }

      const title = `[${branch}/${subject}/${room}] ${student} (${coach})`;

      const newSchedule = {
        id: String(Date.now()),
        title,
        start,
        branch,
        subject,
        room
      };

      schedules.push(newSchedule);
      localStorage.setItem('schedules', JSON.stringify(schedules));

      alert('✅ 일정이 성공적으로 등록되었습니다.');
      closeModal();
      this.reset();
      applyFilters();
    });

    function toggleSelectAll(selectAllCheckbox) {
      document.querySelectorAll('.branch-item').forEach(cb => {
        cb.checked = selectAllCheckbox.checked;
      });
    }

    document.getElementById('coachForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const id = document.getElementById('coachId').value.trim();
      const password = document.getElementById('coachPassword').value.trim();
      const name = document.getElementById('coachName').value.trim();

      const selectedBranches = [];
      if (document.getElementById('branchAll').checked) {
        selectedBranches.push('ALL');
      } else {
        document.querySelectorAll('.branch-item:checked').forEach(cb => {
          selectedBranches.push(cb.value);
        });
      }

      if (selectedBranches.length === 0) {
        alert('최소 하나 이상의 지점을 선택해 주세요.');
        return;
      }

      if (coachList.some(c => c.id === id) || id === 'admin') {
        alert('이미 존재하는 아이디입니다.');
        return;
      }

      coachList.push({ id, password, name, branches: selectedBranches });
      localStorage.setItem('coachList', JSON.stringify(coachList));
      alert(`${name} 계정이 등록되었습니다.`);
      this.reset();
      renderCoachList();
    });

    function renderCoachList() {
      const tbody = document.getElementById('coachTableBody');
      tbody.innerHTML = '';

      if (coachList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color: var(--text-sub);">등록된 코치가 없습니다.</td></tr>';
        return;
      }

      coachList.forEach((coach, index) => {
        const tr = document.createElement('tr');
        let branchBadges = coach.branches.includes('ALL') 
          ? '<span class="badge" style="background:#2563eb; color:#fff;">전체 지점</span>' 
          : coach.branches.filter(b => b !== '운정').map(b => `<span class="badge">${b}점</span>`).join('');

        tr.innerHTML = `
          <td><strong>${coach.name}</strong></td>
          <td>${coach.id}</td>
          <td>${branchBadges}</td>
          <td><button class="btn-delete" onclick="deleteCoach(${index})">삭제</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function deleteCoach(index) {
      if (confirm(`${coachList[index].name} 계정을 삭제하시겠습니까?`)) {
        coachList.splice(index, 1);
        localStorage.setItem('coachList', JSON.stringify(coachList));
        renderCoachList();
      }
    }
  </script>
</body>
</html>
