<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블랙번치 스튜디오 일정 관리 시스템</title>
  
  <!-- FullCalendar CSS -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/main.min.css" rel="stylesheet" />
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <style>
    body {
      padding: 20px;
      background-color: #f8f9fa;
    }
    .main-container {
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    #calendar {
      margin-top: 20px;
      min-height: 700px;
    }
    .filter-section {
      background-color: #f1f3f5;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

<div class="main-container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>🎵 블랙번치 스튜디오 스케줄 관리</h2>
    <div id="authContainer">
      <!-- 로그인 / 사용자 정보 표시 영역 -->
    </div>
  </div>

  <!-- 필터 섹션 (지점, 룸, 코치) -->
  <div class="filter-section">
    <div class="row g-3 align-items-center">
      <div class="col-md-3">
        <label for="branchSelect" class="form-label fw-bold">📍 지점 선택</label>
        <select id="branchSelect" class="form-select">
          <option value="위례점" selected>위례점</option>
          <option value="미사점">미사점</option>
          <option value="다산점">다산점</option>
        </select>
      </div>
      <div class="col-md-3">
        <label for="roomSelect" class="form-label fw-bold">🚪 연습실/레슨실 선택</label>
        <select id="roomSelect" class="form-select">
          <option value="ALL" selected>전체 룸 보기</option>
          <option value="ROOM 1">ROOM 1</option>
          <option value="ROOM 2">ROOM 2</option>
          <option value="ROOM 3">ROOM 3</option>
          <option value="ROOM 4">ROOM 4</option>
          <option value="ROOM 5">ROOM 5</option>
        </select>
      </div>
      <div class="col-md-3">
        <label for="coachFilter" class="form-label fw-bold">🎤 코치 필터</label>
        <select id="coachFilter" class="form-select">
          <option value="ALL" selected>전체 코치 보기</option>
        </select>
      </div>
      <div class="col-md-3 text-end pt-4">
        <button id="addScheduleBtn" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#scheduleModal">
          + 일정 추가
        </button>
      </div>
    </div>
  </div>

  <!-- 캘린더 영역 -->
  <div id="calendar"></div>
</div>

<!-- 일정 추가/수정 모달 -->
<div class="modal fade" id="scheduleModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">일정 추가</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="scheduleForm">
          <input type="hidden" id="scheduleId">
          
          <div class="mb-3">
            <label class="form-label">지점</label>
            <select id="modalBranch" class="form-select" required>
              <option value="위례점">위례점</option>
              <option value="미사점">미사점</option>
              <option value="다산점">다산점</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">학생 이름</label>
            <input type="text" id="modalStudentName" class="form-control" placeholder="학생 성함 입력" required>
          </div>

          <div class="mb-3">
            <label class="form-label">담당 코치</label>
            <select id="modalCoachName" class="form-select" required>
              <!-- JS로 동적 로드 -->
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">과목 / 레슨 내용</label>
            <input type="text" id="modalSubject" class="form-control" placeholder="예: 보컬 레슨 / 발성 교정">
          </div>

          <div class="mb-3">
            <label class="form-label">방 번호(룸)</label>
            <select id="modalRoomName" class="form-select" required>
              <option value="ROOM 1">ROOM 1</option>
              <option value="ROOM 2">ROOM 2</option>
              <option value="ROOM 3">ROOM 3</option>
              <option value="ROOM 4">ROOM 4</option>
              <option value="ROOM 5">ROOM 5</option>
            </select>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">시작 시간</label>
              <input type="datetime-local" id="modalStartTime" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">종료 시간</label>
              <input type="datetime-local" id="modalEndTime" class="form-control" required>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" id="deleteScheduleBtn" class="btn btn-danger d-none">삭제</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
        <button type="button" id="saveScheduleBtn" class="btn btn-primary">저장</button>
      </div>
    </div>
  </div>
</div>

<!-- FullCalendar & Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Supabase JS Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // 1. Supabase 설정 (프로젝트 URL 및 Anon Key 설정)
  const SUPABASE_URL = 'YOUR_SUPABASE_URL'; // 실제 Supabase URL로 설정되어 있는지 확인
  const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; // 실제 Anon Key로 설정되어 있는지 확인
  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let calendar;

  document.addEventListener('DOMContentLoaded', async function() {
    const calendarEl = document.getElementById('calendar');

    // 2. FullCalendar 초기화
    calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'timeGridWeek',
      locale: 'ko',
      headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: 'dayGridMonth,timeGridWeek,timeGridDay'
      },
      // 💡 요청하신 캘린더 시간 설정: 오전 10시 ~ 밤 24시
      slotMinTime: '10:00:00',
      slotMaxTime: '24:00:00',
      allDaySlot: false,
      slotDuration: '00:30:00',
      
      events: async function(fetchInfo, successCallback, failureCallback) {
        try {
          const selectedBranch = document.getElementById('branchSelect').value;
          const selectedRoom = document.getElementById('roomSelect').value;
          const selectedCoach = document.getElementById('coachFilter').value;

          let query = supabase.from('schedules').select('*').eq('branch', selectedBranch);

          if (selectedRoom !== 'ALL') {
            query = query.eq('room_name', selectedRoom);
          }
          if (selectedCoach !== 'ALL') {
            query = query.eq('coach_name', selectedCoach);
          }

          const { data, error } = await query;
          if (error) throw error;

          const events = data.map(item => ({
            id: item.id,
            title: `[${item.room_name}] ${item.student_name} (${item.coach_name})`,
            start: item.start_time,
            end: item.end_time,
            extendedProps: item
          }));

          successCallback(events);
        } catch (err) {
          console.error("스케줄 로딩 오류:", err);
          failureCallback(err);
        }
      },

      eventClick: function(info) {
        // 이벤트 클릭 시 수정 모달 열기
        openEditModal(info.event.extendedProps);
      }
    });

    calendar.render();

    // 지점/룸/코치 필터 변경 이벤트 등록
    document.getElementById('branchSelect').addEventListener('change', () => calendar.refetchEvents());
    document.getElementById('roomSelect').addEventListener('change', () => calendar.refetchEvents());
    document.getElementById('coachFilter').addEventListener('change', () => calendar.refetchEvents());
  });

  function openEditModal(scheduleData) {
    document.getElementById('modalTitle').innerText = "일정 수정";
    document.getElementById('scheduleId').value = scheduleData.id;
    document.getElementById('modalBranch').value = scheduleData.branch || '위례점';
    document.getElementById('modalStudentName').value = scheduleData.student_name;
    document.getElementById('modalCoachName').value = scheduleData.coach_name;
    document.getElementById('modalSubject').value = scheduleData.subject || '';
    document.getElementById('modalRoomName').value = scheduleData.room_name;
    document.getElementById('modalStartTime').value = scheduleData.start_time.slice(0, 16);
    document.getElementById('modalEndTime').value = scheduleData.end_time.slice(0, 16);

    document.getElementById('deleteScheduleBtn').classList.remove('d-none');
    const modal = new bootstrap.Modal(document.getElementById('scheduleModal'));
    modal.show();
  }
</script>

</body>
</html>
