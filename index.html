<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블랙번치 스튜디오 - 통합 관리 시스템</title>
  
  <!-- FullCalendar 라이브러리 (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
  
  <style>
    :root {
      --bg-color: #0f0f11;
      --card-bg: #1a1a1e;
      --accent-color: #3b82f6;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --border-color: #2e2e38;
      --danger-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .top-bar h1 {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.9rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .card h2 {
      font-size: 1.15rem;
      margin-bottom: 16px;
      color: var(--text-main);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-sub);
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      background-color: #121215;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .branch-checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background-color: #121215;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text-main);
      user-select: none;
    }

    .checkbox-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #2563eb;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.85rem;
      width: auto;
      background-color: #27272a;
      border: 1px solid var(--border-color);
    }

    .btn-sm:hover {
      background-color: #3f3f46;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }

    th {
      color: var(--text-sub);
      font-weight: 600;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      background-color: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
      border-radius: 4px;
      font-size: 0.8rem;
      margin-right: 4px;
    }

    .btn-delete {
      background-color: transparent;
      color: var(--danger-color);
      border: 1px solid var(--danger-color);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .btn-delete:hover {
      background-color: var(--danger-color);
      color: #fff;
    }

    .hidden {
      display: none !important;
    }

    .login-container {
      max-width: 400px;
      margin: 80px auto 0;
    }

    /* FullCalendar 어두운 테마 커스텀 */
    #calendar {
      margin-top: 16px;
      background: #121215;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }
    .fc {
      --fc-border-color: #2e2e38;
      --fc-page-bg-color: #121215;
      --fc-neutral-bg-color: #1a1a1e;
      --fc-list-event-hover-bg-color: #27272a;
      color: var(--text-main);
    }
    .fc .fc-toolbar-title {
      font-size: 1.1rem;
      font-weight: bold;
    }
    .fc .fc-button-primary {
      background-color: #27272a;
      border-color: var(--border-color);
    }
    .fc .fc-button-primary:hover {
      background-color: #3f3f46;
    }
    .fc .fc-button-primary:not(:disabled).fc-button-active {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
    }

    .filter-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. 로그인 전 화면 -->
    <div id="loginView" class="login-container">
      <div class="card">
        <h2 style="text-align: center; margin-bottom: 20px;">BLACK BUNCH STUDIO<br><span style="font-size: 0.9rem; color: var(--text-sub); font-weight: normal;">관리 시스템 로그인</span></h2>
        <form id="loginForm">
          <div class="form-group">
            <label for="loginId">아이디</label>
            <input type="text" id="loginId" class="form-control" placeholder="아이디 입력" required>
          </div>
          <div class="form-group">
            <label for="loginPassword">비밀번호</label>
            <input type="password" id="loginPassword" class="form-control" placeholder="비밀번호 입력" required>
          </div>
          <button type="submit" class="btn">로그인</button>
        </form>
        <p style="font-size: 0.8rem; color: var(--text-sub); text-align: center; margin-top: 16px;">
          * 어드민 계정: admin / admin1234
        </p>
      </div>
    </div>

    <!-- 2. 상단 바 -->
    <div id="appHeader" class="top-bar hidden">
      <h1 id="pageTitle">어드민 - 코치 계정 및 지점 권한 관리</h1>
      <div class="user-info">
        <span id="userInfoText"></span>
        <button class="btn btn-sm" onclick="logout()">로그아웃</button>
      </div>
    </div>

    <!-- 3. 어드민 전용 화면 -->
    <div id="adminView" class="hidden">
      <div class="card">
        <h2>신규 코치 계정 등록</h2>
        <form id="coachForm">
          <div class="form-group">
            <label for="coachId">아이디</label>
            <input type="text" id="coachId" class="form-control" placeholder="아이디 입력" required>
          </div>

          <div class="form-group">
            <label for="coachPassword">비밀번호</label>
            <input type="password" id="coachPassword" class="form-control" placeholder="비밀번호 입력" required>
          </div>

          <div class="form-group">
            <label for="coachName">코치 이름</label>
            <input type="text" id="coachName" class="form-control" placeholder="예: 연우 코치" required>
          </div>

          <div class="form-group">
            <label>담당 지점 (다중 선택 가능)</label>
            <div class="branch-checkbox-group">
              <label class="checkbox-item">
                <input type="checkbox" name="branch" value="ALL" id="branchAll" onchange="toggleSelectAll(this)">
                <strong>전체 지점 (ALL)</strong>
              </label>
              <label class="checkbox-item">
                <input type="checkbox" name="branch" value="미사" class="branch-item"> 미사점
              </label>
              <label class="checkbox-item">
                <input type="checkbox" name="branch" value="위례" class="branch-item"> 위례점
              </label>
              <label class="checkbox-item">
                <input type="checkbox" name="branch" value="다산" class="branch-item"> 다산점
              </label>
            </div>
          </div>

          <button type="submit" class="btn">코치 계정 생성</button>
        </form>
      </div>

      <div class="card">
        <h2>등록된 코치 목록</h2>
        <table>
          <thead>
            <tr>
              <th>이름</th>
              <th>아이디</th>
              <th>담당 지점</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody id="coachTableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 4. 코치 전용 캘린더 화면 -->
    <div id="coachView" class="hidden">
      <div class="card">
        <h2>📅 레슨 및 예약 캘린더</h2>
        
        <!-- 지점 필터링 드롭다운 (허용된 지점만 표시) -->
        <div class="filter-bar">
          <label style="font-weight: 600; font-size: 0.9rem;">지점 선택:</label>
          <select id="branchSelectFilter" class="form-control" style="width: 200px;" onchange="filterCalendarByBranch()">
            <!-- JS로 동적 생성 -->
          </select>
          <button class="btn btn-sm" style="margin-left: auto;" onclick="addSampleSchedule()">+ 테스트 레슨 추가</button>
        </div>

        <!-- 캘린더 표시 영역 -->
        <div id="calendar"></div>
      </div>
    </div>

  </div>

  <script>
    let coachList = JSON.parse(localStorage.getItem('coachList')) || [];
    let currentUser = JSON.parse(sessionStorage.getItem('currentUser')) || null;
    let calendar = null;

    // 샘플 일정 저장소
    let schedules = JSON.parse(localStorage.getItem('schedules')) || [
      { id: '1', title: '[미사] 홍길동 수강생 레슨', start: new Date().toISOString().split('T')[0] + 'T14:00:00', branch: '미사' },
      { id: '2', title: '[위례] 김철수 수강생 레슨', start: new Date().toISOString().split('T')[0] + 'T16:00:00', branch: '위례' },
      { id: '3', title: '[다산] 이영희 연습실 예약', start: new Date().toISOString().split('T')[0] + 'T18:00:00', branch: '다산' }
    ];

    window.addEventListener('DOMContentLoaded', () => {
      if (currentUser) {
        showMainView(currentUser);
      } else {
        showLoginView();
      }
    });

    // 로그인
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const id = document.getElementById('loginId').value.trim();
      const pw = document.getElementById('loginPassword').value.trim();

      if (id === 'admin' && pw === 'admin1234') {
        const adminUser = { role: 'admin', name: '어드민(원장님)', id: 'admin' };
        sessionStorage.setItem('currentUser', JSON.stringify(adminUser));
        showMainView(adminUser);
        this.reset();
        return;
      }

      const coach = coachList.find(c => c.id === id && c.password === pw);
      if (coach) {
        const coachUser = { role: 'coach', name: coach.name, id: coach.id, branches: coach.branches };
        sessionStorage.setItem('currentUser', JSON.stringify(coachUser));
        showMainView(coachUser);
        this.reset();
        return;
      }

      alert('아이디 또는 비밀번호가 일치하지 않습니다.');
    });

    function logout() {
      sessionStorage.removeItem('currentUser');
      currentUser = null;
      showLoginView();
    }

    function showLoginView() {
      document.getElementById('loginView').classList.remove('hidden');
      document.getElementById('appHeader').classList.add('hidden');
      document.getElementById('adminView').classList.add('hidden');
      document.getElementById('coachView').classList.add('hidden');
    }

    function showMainView(user) {
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('appHeader').classList.remove('hidden');
      document.getElementById('userInfoText').textContent = `${user.name} 님`;

      if (user.role === 'admin') {
        document.getElementById('pageTitle').textContent = '어드민 - 코치 계정 및 지점 권한 관리';
        document.getElementById('adminView').classList.remove('hidden');
        document.getElementById('coachView').classList.add('hidden');
        renderCoachList();
      } else {
        document.getElementById('pageTitle').textContent = `${user.name} 코치 대시보드`;
        document.getElementById('adminView').classList.add('hidden');
        document.getElementById('coachView').classList.remove('hidden');
        
        setupCoachBranchFilter(user.branches);
        initCalendar();
      }
    }

    // 코치 지점 드롭다운 필터 세팅
    function setupCoachBranchFilter(userBranches) {
      const filterSelect = document.getElementById('branchSelectFilter');
      filterSelect.innerHTML = '';

      let availableBranches = [];
      if (userBranches.includes('ALL')) {
        availableBranches = ['미사', '위례', '다산'];
        filterSelect.innerHTML += `<option value="ALL">전체 지점 보기</option>`;
      } else {
        availableBranches = userBranches.filter(b => b !== '운정');
      }

      availableBranches.forEach(b => {
        filterSelect.innerHTML += `<option value="${b}">${b}점</option>`;
      });
    }

    // FullCalendar 초기화
    function initCalendar() {
      const calendarEl = document.getElementById('calendar');
      
      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek'
        },
        locale: 'ko',
        events: getFilteredEvents()
      });

      calendar.render();
    }

    // 지점 필터링된 일정 반환
    function getFilteredEvents() {
      const selectedBranch = document.getElementById('branchSelectFilter').value;
      if (selectedBranch === 'ALL') {
        return schedules;
      }
      return schedules.filter(s => s.branch === selectedBranch);
    }

    function filterCalendarByBranch() {
      if (calendar) {
        calendar.removeAllEvents();
        calendar.addEventSource(getFilteredEvents());
      }
    }

    // 테스트 일정 추가 기능
    function addSampleSchedule() {
      const selectedBranch = document.getElementById('branchSelectFilter').value;
      const targetBranch = selectedBranch === 'ALL' ? '미사' : selectedBranch;
      
      const title = prompt('레슨/예약 제목을 입력하세요:', `[${targetBranch}] 신규 수강생 레슨`);
      if (title) {
        const newEvent = {
          id: String(Date.now()),
          title: title,
          start: new Date().toISOString().split('T')[0] + 'T12:00:00',
          branch: targetBranch
        };
        schedules.push(newEvent);
        localStorage.setItem('schedules', JSON.stringify(schedules));
        filterCalendarByBranch();
      }
    }

    // 어드민 전용 함수
    function toggleSelectAll(selectAllCheckbox) {
      document.querySelectorAll('.branch-item').forEach(cb => {
        cb.checked = selectAllCheckbox.checked;
      });
    }

    document.getElementById('coachForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const id = document.getElementById('coachId').value.trim();
      const password = document.getElementById('coachPassword').value.trim();
      const name = document.getElementById('coachName').value.trim();

      const selectedBranches = [];
      if (document.getElementById('branchAll').checked) {
        selectedBranches.push('ALL');
      } else {
        document.querySelectorAll('.branch-item:checked').forEach(cb => {
          selectedBranches.push(cb.value);
        });
      }

      if (selectedBranches.length === 0) {
        alert('최소 하나 이상의 지점을 선택해 주세요.');
        return;
      }

      if (coachList.some(c => c.id === id) || id === 'admin') {
        alert('이미 존재하는 아이디입니다.');
        return;
      }

      coachList.push({ id, password, name, branches: selectedBranches });
      localStorage.setItem('coachList', JSON.stringify(coachList));
      alert(`${name} 계정이 생성되었습니다.`);
      this.reset();
      renderCoachList();
    });

    function renderCoachList() {
      const tbody = document.getElementById('coachTableBody');
      tbody.innerHTML = '';

      if (coachList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color: var(--text-sub);">등록된 코치가 없습니다.</td></tr>';
        return;
      }

      coachList.forEach((coach, index) => {
        const tr = document.createElement('tr');
        let branchBadges = coach.branches.includes('ALL') 
          ? '<span class="badge" style="background:#2563eb; color:#fff;">전체 지점</span>' 
          : coach.branches.filter(b => b !== '운정').map(b => `<span class="badge">${b}점</span>`).join('');

        tr.innerHTML = `
          <td><strong>${coach.name}</strong></td>
          <td>${coach.id}</td>
          <td>${branchBadges}</td>
          <td><button class="btn-delete" onclick="deleteCoach(${index})">삭제</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function deleteCoach(index) {
      if (confirm(`${coachList[index].name} 계정을 삭제하시겠습니까?`)) {
        coachList.splice(index, 1);
        localStorage.setItem('coachList', JSON.stringify(coachList));
        renderCoachList();
      }
    }
  </script>
</body>
</html>
