<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블랙번치 스튜디오 - 어드민 코치 관리</title>
  <style>
    :root {
      --bg-color: #0f0f11;
      --card-bg: #1a1a1e;
      --accent-color: #3b82f6;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --border-color: #2e2e38;
      --danger-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .card h2 {
      font-size: 1.15rem;
      margin-bottom: 16px;
      color: var(--text-main);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-sub);
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      background-color: #121215;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    /* 다중 지점 선택 체크박스 스타일 */
    .branch-checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      background-color: #121215;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text-main);
      user-select: none;
    }

    .checkbox-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #2563eb;
    }

    /* 코치 목록 테이블 */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }

    th {
      color: var(--text-sub);
      font-weight: 600;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      background-color: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
      border-radius: 4px;
      font-size: 0.8rem;
      margin-right: 4px;
      margin-bottom: 2px;
    }

    .btn-delete {
      background-color: transparent;
      color: var(--danger-color);
      border: 1px solid var(--danger-color);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .btn-delete:hover {
      background-color: var(--danger-color);
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>어드민 - 코치 계정 및 지점 권한 관리</h1>

    <!-- 계정 생성 카드 -->
    <div class="card">
      <h2>신규 코치 계정 등록</h2>
      <form id="coachForm">
        <div class="form-group">
          <label for="coachId">아이디</label>
          <input type="text" id="coachId" class="form-control" placeholder="아이디 입력" required>
        </div>

        <div class="form-group">
          <label for="coachPassword">비밀번호</label>
          <input type="password" id="coachPassword" class="form-control" placeholder="비밀번호 입력" required>
        </div>

        <div class="form-group">
          <label for="coachName">코치 이름</label>
          <input type="text" id="coachName" class="form-control" placeholder="예: 연우 코치" required>
        </div>

        <!-- 담당 지점 다중 선택 -->
        <div class="form-group">
          <label>담당 지점 (다중 선택 가능)</label>
          <div class="branch-checkbox-group">
            <label class="checkbox-item">
              <input type="checkbox" name="branch" value="ALL" id="branchAll" onchange="toggleSelectAll(this)">
              <strong>전체 지점 (ALL)</strong>
            </label>
            <label class="checkbox-item">
              <input type="checkbox" name="branch" value="미사" class="branch-item"> 미사점
            </label>
            <label class="checkbox-item">
              <input type="checkbox" name="branch" value="위례" class="branch-item"> 위례점
            </label>
            <label class="checkbox-item">
              <input type="checkbox" name="branch" value="다산" class="branch-item"> 다산점
            </label>
            <label class="checkbox-item">
              <input type="checkbox" name="branch" value="운정" class="branch-item"> 운정점
            </label>
          </div>
        </div>

        <button type="submit" class="btn">코치 계정 생성</button>
      </form>
    </div>

    <!-- 코치 목록 카드 -->
    <div class="card">
      <h2>등록된 코치 목록</h2>
      <table>
        <thead>
          <tr>
            <th>이름</th>
            <th>아이디</th>
            <th>담당 지점</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody id="coachTableBody">
          <!-- JS로 동적 생성 -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // 임시 저장소 (LocalStorage 활용)
    let coachList = JSON.parse(localStorage.getItem('coachList')) || [];

    // 전체 지점 체크 박스 토글 로직
    function toggleSelectAll(selectAllCheckbox) {
      const branchCheckboxes = document.querySelectorAll('.branch-item');
      branchCheckboxes.forEach(cb => {
        cb.checked = selectAllCheckbox.checked;
      });
    }

    // 개별 체크박스 변경 시 전체지점 체크박스 상태 업데이트
    document.querySelectorAll('.branch-item').forEach(cb => {
      cb.addEventListener('change', () => {
        const branchCheckboxes = document.querySelectorAll('.branch-item');
        const checkedBoxes = document.querySelectorAll('.branch-item:checked');
        const selectAllCheckbox = document.getElementById('branchAll');

        if (branchCheckboxes.length === checkedBoxes.length) {
          selectAllCheckbox.checked = true;
        } else {
          selectAllCheckbox.checked = false;
        }
      });
    });

    // 폼 제출 (계정 생성)
    document.getElementById('coachForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const id = document.getElementById('coachId').value.trim();
      const password = document.getElementById('coachPassword').value.trim();
      const name = document.getElementById('coachName').value.trim();

      // 선택된 지점 배열 추출
      const selectedBranches = [];
      const isAllChecked = document.getElementById('branchAll').checked;

      if (isAllChecked) {
        selectedBranches.push('ALL');
      } else {
        document.querySelectorAll('.branch-item:checked').forEach(cb => {
          selectedBranches.push(cb.value);
        });
      }

      if (selectedBranches.length === 0) {
        alert('최소 하나 이상의 지점을 선택해 주세요.');
        return;
      }

      // 아이디 중복 확인
      if (coachList.some(coach => coach.id === id)) {
        alert('이미 존재하는 아이디입니다.');
        return;
      }

      // 코치 데이터 객체 생성
      const newCoach = {
        id,
        password,
        name,
        branches: selectedBranches // 다중 지점 배열로 저장 (예: ["미사", "위례"])
      };

      coachList.push(newCoach);
      localStorage.setItem('coachList', JSON.stringify(coachList));

      alert(`${name} 코치 계정이 생성되었습니다.`);
      this.reset();
      renderCoachList();
    });

    // 코치 목록 랜더링
    function renderCoachList() {
      const tbody = document.getElementById('coachTableBody');
      tbody.innerHTML = '';

      if (coachList.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color: var(--text-sub);">등록된 코치가 없습니다.</td></tr>';
        return;
      }

      coachList.forEach((coach, index) => {
        const tr = document.createElement('tr');
        
        // 지점 뱃지 생성
        let branchBadges = '';
        if (coach.branches.includes('ALL')) {
          branchBadges = '<span class="badge" style="background:#2563eb; color:#fff;">전체 지점</span>';
        } else {
          branchBadges = coach.branches.map(b => `<span class="badge">${b}점</span>`).join('');
        }

        tr.innerHTML = `
          <td><strong>${coach.name}</strong></td>
          <td>${coach.id}</td>
          <td>${branchBadges}</td>
          <td><button class="btn-delete" onclick="deleteCoach(${index})">삭제</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 코치 삭제
    function deleteCoach(index) {
      if (confirm(`${coachList[index].name} 코치 계정을 삭제하시겠습니까?`)) {
        coachList.splice(index, 1);
        localStorage.setItem('coachList', JSON.stringify(coachList));
        renderCoachList();
      }
    }

    // 초기 실행
    renderCoachList();
  </script>
</body>
</html>
