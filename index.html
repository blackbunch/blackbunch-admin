<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블랙번치 스튜디오 어드민</title>
  
  <!-- favicon 404 에러 방지 -->
  <link rel="icon" href="data:,">

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    /* 기본 스타일 설정 */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background-color: #121212; color: #ffffff; }
    .hidden { display: none !important; }
    
    /* 레이아웃 및 폼 스타일 */
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .card { background-color: #1e1e1e; border-radius: 8px; padding: 24px; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 8px; color: #a0a0a0; }
    .form-control { width: 100%; padding: 10px; background-color: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 4px; color: #fff; }
    .btn { padding: 10px 16px; background-color: #4f46e5; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .btn:hover { background-color: #4338ca; }
    .btn-danger { background-color: #dc2626; }
    .btn-danger:hover { background-color: #b91c1c; }
    .btn-sm { padding: 6px 12px; font-size: 14px; }
  </style>
</head>
<body>

  <div class="container">
    <!-- 로그인 뷰 -->
    <div id="loginView" class="card" style="max-width: 400px; margin: 100px auto;">
      <h2 style="margin-bottom: 20px; text-align: center;">관리자 로그인</h2>
      <form id="loginForm">
        <div class="form-group">
          <label>아이디</label>
          <input type="text" id="username" class="form-control" required>
        </div>
        <div class="form-group">
          <label>비밀번호</label>
          <input type="password" id="password" class="form-control" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">로그인</button>
      </form>
    </div>

    <!-- 메인 관리자 뷰 -->
    <div id="mainView" class="hidden">
      <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h1>블랙번치 스튜디오 관리 시스템</h1>
        <button id="btnLogout" class="btn btn-sm btn-danger">로그아웃</button>
      </header>

      <div class="card">
        <h3>일정 및 레슨 관리</h3>
        <p style="margin-top: 10px; color: #a0a0a0;">정상적으로 데이터베이스에 연결되었습니다.</p>
      </div>
    </div>
  </div>

<script>
// --------------------------------------------------
// Supabase 프로젝트 주소 및 API Key 설정 (단 1회만 선언)
// --------------------------------------------------
const SUPABASE_URL = 'https://tnqptimvhfckipdtujrn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_6oY8ES_Cz6BzemiBkDBC_wl_g_GQP';

// 라이브러리 객체(window.supabase)와 변수명 충돌을 방지하기 위해 supabaseClient로 선언
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let coachList = [];
let schedules = [];
let currentUser = JSON.parse(sessionStorage.getItem('currentUser')) || null;
let calendar = null;

window.addEventListener('DOMContentLoaded', async () => {
  if (currentUser) {
    showMainView(currentUser);
    await fetchCoaches();
    await fetchSchedules();
  } else {
    showLoginView();
  }
});

// 코치 목록 불러오기
async function fetchCoaches() {
  try {
    const { data, error } = await supabaseClient.from('coaches').select('*');
    if (error) throw error;
    if (data) coachList = data;
  } catch (err) {
    console.error('Coaches 불러오기 실패:', err);
  }
}

// 일정 목록 불러오기
async function fetchSchedules() {
  try {
    const { data, error } = await supabaseClient.from('schedules').select('*');
    if (error) throw error;
    if (data) schedules = data;
  } catch (err) {
    console.error('Schedules 불러오기 실패:', err);
  }
}

// 로그인 (Supabase coaches 테이블의 username, password 필드 참조)
document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const usernameInput = document.getElementById('username').value;
  const passwordInput = document.getElementById('password').value;

  try {
    const { data, error } = await supabaseClient
      .from('coaches')
      .select('*')
      .eq('username', usernameInput)
      .eq('password', passwordInput)
      .single();

    if (error || !data) {
      alert('아이디 또는 비밀번호가 일치하지 않습니다.');
      return;
    }

    currentUser = data;
    sessionStorage.setItem('currentUser', JSON.stringify(currentUser));
    showMainView(currentUser);
    await fetchCoaches();
    await fetchSchedules();
  } catch (err) {
    console.error('로그인 오류:', err);
    alert('로그인 처리 중 오류가 발생했습니다.');
  }
});

// 로그아웃
document.getElementById('btnLogout')?.addEventListener('click', () => {
  sessionStorage.removeItem('currentUser');
  currentUser = null;
  showLoginView();
});

function showMainView(user) {
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('mainView').classList.remove('hidden');
}

function showLoginView() {
  document.getElementById('loginView').classList.remove('hidden');
  document.getElementById('mainView').classList.add('hidden');
}
</script>
</body>
</html>
