<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>블랙번치 스튜디오 일정 관리 시스템</title>

  <link rel="shortcut icon" href="#">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/main.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <style>
    * {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    *:focus, *:active { outline: none !important; }

    body {
      padding: 20px 12px;
      background-color: #0f1015;
      color: #f1f3f5;
      min-height: 100vh;
    }

    .login-container {
      max-width: 400px;
      margin: 60px auto;
      background: #181920;
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid #282a36;
    }

    .main-container {
      max-width: 1400px;
      margin: 0 auto;
      background: #181920;
      padding: 20px 16px;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
      border: 1px solid #282a36;
    }

    .schedule-type-nav {
      display: flex;
      gap: 10px;
      border-bottom: 2px solid #2e3140;
      padding-bottom: 12px;
      margin-bottom: 20px;
      overflow-x: auto;
    }
    .schedule-type-btn {
      background-color: #21232d;
      color: #a0a5b5;
      border: 1px solid #2e3140;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .schedule-type-btn.active {
      background-color: #4f46e5;
      color: #ffffff;
      border-color: #4f46e5;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
    }
    .schedule-type-btn.consulting-tab.active {
      background-color: #ec4899;
      border-color: #ec4899;
      box-shadow: 0 4px 12px rgba(236, 72, 153, 0.4);
    }
    .schedule-type-btn.practice-tab.active {
      background-color: #10b981;
      border-color: #10b981;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
    }

    .filter-section {
      background-color: #21232d;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid #2e3140;
    }

    .form-label {
      color: #a0a5b5;
      font-size: 0.85rem;
      margin-bottom: 6px;
    }

    .form-select, .form-control {
      background-color: #14151b;
      color: #ffffff;
      border: 1px solid #2e3140;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 0.9rem;
    }
    .form-select:focus, .form-control:focus {
      background-color: #14151b;
      color: #ffffff;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
    }

    .readonly-select {
      pointer-events: none;
      background-color: #1c1e28 !important;
      color: #818cf8 !important;
      border-color: #2e3140 !important;
    }

    .btn-primary {
      background-color: #4f46e5;
      border-color: #4f46e5;
      border-radius: 8px;
      font-weight: 600;
    }
    .btn-primary:hover {
      background-color: #4338ca;
      border-color: #4338ca;
    }

    #calendar { 
      margin-top: 15px; 
      height: 700px;
    }
    .fc { color: #e2e8f0; }
    .fc-theme-standard td, .fc-theme-standard th { border-color: #262836 !important; }
    .fc-theme-standard .fc-scrollgrid {
      border: 1px solid #262836 !important;
      border-radius: 12px;
      overflow: hidden;
    }
    
    .fc-timegrid-cols table, .fc-col-header table {
      width: 100% !important;
      table-layout: fixed !important;
    }
    .fc-timegrid-axis { width: 60px !important; }

    /* 이미지 스타일 반영: 헤더 밝은 보라/백색 배경 + 또렷한 퍼플 텍스트 */
    .fc-col-header-cell {
      background-color: #f0f0ff !important;
      padding: 10px 0 !important;
      border-bottom: 2px solid #dcdcfe !important;
    }
    .fc-col-header-cell-cushion {
      color: #6366f1 !important;
      font-weight: 800 !important;
      font-size: 0.95rem !important;
      text-decoration: none !important;
    }
    
    .fc .fc-day-today { background-color: rgba(99, 102, 241, 0.08) !important; }

    .fc-timegrid-slot-label-cushion {
      color: #a0a5b5;
      font-size: 0.78rem;
      font-weight: 500;
    }

    .fc-button-primary {
      background-color: #21232d !important;
      border: 1px solid #2e3140 !important;
      color: #cbd5e1 !important;
      border-radius: 8px !important;
      font-size: 0.8rem !important;
      font-weight: 500 !important;
      padding: 5px 10px !important;
      box-shadow: none !important;
    }
    .fc-button-primary:hover {
      background-color: #2e3140 !important;
      color: #ffffff !important;
    }
    .fc-button-active {
      background-color: #4f46e5 !important;
      border-color: #4f46e5 !important;
      color: #ffffff !important;
    }
    .fc-toolbar-title {
      font-size: 1.1rem !important;
      font-weight: 700;
      color: #f8fafc;
    }

    /* 이미지 스타일 반영: 둥근 모서리와 흰 테두리를 가진 카드형 스타일 */
    .fc-timegrid-event {
      border-radius: 8px !important;
      padding: 4px 8px !important;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      border: 1.5px solid #ffffff !important;
      cursor: pointer !important;
      z-index: 5 !important;
      margin: 2px 3px !important;
    }

    .fc-event-main {
      padding: 0 !important;
      font-size: 0.82rem !important;
      font-weight: 800 !important;
      color: #ffffff !important;
      line-height: 1.3;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
      width: 100%;
      letter-spacing: -0.3px;
    }

    .fc-event-time { display: none !important; }

    .fc-event-unassigned {
      background-color: #1c1d22 !important;
      border: 1.5px solid #f59e0b !important;
      color: #fbbf24 !important;
    }

    .unassigned-container {
      background-color: #1e1b2e;
      border: 1px solid #d97706;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .unassigned-card {
      background-color: #14151b;
      border: 1px solid #2e3140;
      border-radius: 8px;
      padding: 10px 14px;
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .coach-unassigned-section {
      background: #14151b;
      border: 1px solid #2e3140;
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
    }

    .modal-content {
      background-color: #181920;
      color: #e2e8f0;
      border: 1px solid #2e3140;
      border-radius: 16px;
    }
    .modal-header, .modal-footer { border-color: #2e3140; }
    .btn-close { filter: invert(1); }
    
    .branch-checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      padding-top: 4px;
    }

    .table-dark-custom {
      color: #e2e8f0;
      border-color: #2e3140;
    }
    .table-dark-custom th {
      background-color: #21232d;
      border-color: #2e3140;
      color: #94a3b8;
    }
    .table-dark-custom td { border-color: #2e3140; }

    @media (max-width: 768px) {
      body { padding: 8px 4px; }
      .main-container { padding: 12px 8px; border-radius: 12px; }
      .fc-toolbar { flex-direction: column; gap: 8px; }
      .fc-toolbar-title { font-size: 0.95rem !important; }
      .fc-header-toolbar { margin-bottom: 0.6rem !important; }
      .fc-button-primary { padding: 4px 8px !important; font-size: 0.75rem !important; }
      .filter-section { padding: 10px; margin-bottom: 12px; }
      .modal-dialog { margin: 10px; }
      #calendar { height: 500px; }
      .fc-timegrid-axis { width: 45px !important; }
      .fc-timegrid-slot-label-cushion { font-size: 0.65rem !important; }
      .fc-col-header-cell { padding: 6px 0 !important; }
      .fc-col-header-cell-cushion { font-size: 0.8rem !important; }
      .fc-event-main { font-size: 0.75rem !important; }
    }
  </style>
</head>
<body>

<div id="loginView" class="login-container">
  <div class="text-center mb-4">
    <h3 class="fw-bold text-white mb-2">🎵 블랙번치 스튜디오</h3>
    <p class="text-secondary small mb-0">일정 관리 시스템 로그인</p>
  </div>
  <form onsubmit="event.preventDefault(); handleLogin();">
    <div class="mb-3">
      <label class="form-label font-weight-bold">아이디</label>
      <input type="text" id="loginEmail" class="form-control" placeholder="아이디를 입력하세요" required>
    </div>
    <div class="mb-4">
      <label class="form-label font-weight-bold">비밀번호</label>
      <input type="password" id="loginPassword" class="form-control" placeholder="비밀번호를 입력하세요" required>
    </div>
    <button type="submit" id="loginBtn" class="btn btn-primary w-100 py-2">로그인</button>
  </form>
</div>

<div id="mainApp" class="main-container d-none">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
    <h4 class="fw-bold m-0">🎵 블랙번치 스튜디오 스케줄</h4>
    <div id="authContainer" class="d-flex align-items-center gap-2">
      <button id="manageCoachBtn" class="btn btn-outline-light btn-sm d-none" style="border-radius:8px;" data-bs-toggle="modal" data-bs-target="#coachModal">
        ⚙️ 코치 관리
      </button>
      <span id="userInfo" class="fw-bold small text-secondary"></span>
      <button id="authBtn" class="btn btn-sm btn-outline-danger" style="border-radius:8px;" onclick="handleLogout()">로그아웃</button>
    </div>
  </div>

  <div class="schedule-type-nav">
    <button id="tabLesson" class="schedule-type-btn active" onclick="switchScheduleType('lesson')">
      🎵 레슨 스케줄
    </button>
    <button id="tabConsulting" class="schedule-type-btn consulting-tab" onclick="switchScheduleType('consulting')">
      📋 상담 스케줄
    </button>
    <button id="tabPractice" class="schedule-type-btn practice-tab" onclick="switchScheduleType('practice')">
      🎹 연습실 대여
    </button>
  </div>

  <div class="unassigned-container">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
      <div class="d-flex align-items-center gap-3">
        <h6 id="unassignedTitle" class="fw-bold text-warning m-0">⏳ 1단계: 레슨생 정보 등록 (미정 목록)</h6>
        <div class="d-flex align-items-center gap-1" id="coachFilterWrapper">
          <label class="text-secondary small mb-0 text-nowrap" style="font-size: 0.8rem;">코치 필터:</label>
          <select id="unassignedCoachFilter" class="form-select form-select-sm py-0 px-2" style="font-size:0.8rem; height:28px;" onchange="renderUnassignedList()">
            <option value="ALL">전체 보기</option>
          </select>
        </div>
      </div>
      <button id="unassignedAddBtn" class="btn btn-sm btn-outline-warning" style="border-radius:6px; font-size:0.8rem;" onclick="toggleUnassignedForm()">+ 미정 레슨생 등록</button>
    </div>

    <div id="unassignedForm" class="p-3 bg-dark rounded border border-secondary mb-3 d-none">
      <div class="row g-2">
        <div class="col-6 col-md-2">
          <label class="form-label small">지점</label>
          <select id="unBranch" class="form-select form-select-sm">
            <option value="위례점" selected>위례점</option>
            <option value="미사점">미사점</option>
            <option value="다산점">다산점</option>
          </select>
        </div>
        <div class="col-6 col-md-2">
          <label id="unNameLabel" class="form-label small">수강생/이용자 이름</label>
          <input type="text" id="unStudentName" class="form-control form-control-sm" placeholder="성함 입력">
        </div>
        <div class="col-6 col-md-2 consulting-only-field practice-field d-none">
          <label class="form-label small">연락처</label>
          <input type="text" id="unPhone" class="form-control form-control-sm" placeholder="010-0000-0000">
        </div>
        <div class="col-6 col-md-2 lesson-only-field">
          <label class="form-label small">총 회차</label>
          <select id="unSessions" class="form-select form-select-sm">
            <option value="1">1회 (원데이)</option>
            <option value="2">2회</option>
            <option value="3">3회</option>
            <option value="4" selected>4회 (1개월 기본)</option>
            <option value="8">8회 (2개월)</option>
            <option value="12">12회 (3개월)</option>
            <option value="16">16회 (4개월)</option>
            <option value="20">20회 (5개월)</option>
            <option value="24">24회 (6개월)</option>
          </select>
        </div>
        <div class="col-6 col-md-2 coach-field">
          <label class="form-label small">담당 코치</label>
          <select id="unCoachName" class="form-select form-select-sm"></select>
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label small">구분 / 이용 시간</label>
          <select id="unSubject" class="form-select form-select-sm"></select>
        </div>
        <div class="col-6 col-md-2 room-field">
          <label class="form-label small">이용 룸</label>
          <select id="unRoomName" class="form-select form-select-sm"></select>
        </div>
        <div class="col-12 text-end mt-2">
          <button class="btn btn-sm btn-warning" style="border-radius:6px;" onclick="addUnassignedStudent()">미정 목록에 저장</button>
        </div>
      </div>
    </div>

    <div id="unassignedList"></div>
  </div>

  <div class="filter-section">
    <div class="row g-2 align-items-center">
      <div class="col-6 col-md-3">
        <label for="branchSelect" class="form-label fw-bold">📍 지점 선택</label>
        <select id="branchSelect" class="form-select">
          <option value="위례점" selected>위례점</option>
          <option value="미사점">미사점</option>
          <option value="다산점">다산점</option>
        </select>
      </div>
      <div class="col-6 col-md-3 room-field">
        <label for="roomSelect" class="form-label fw-bold">🚪 룸/연습실 필터</label>
        <select id="roomSelect" class="form-select"></select>
      </div>
      <div class="col-6 col-md-3 coach-field">
        <label for="coachFilter" class="form-label fw-bold">🎤 코치 필터</label>
        <select id="coachFilter" class="form-select">
          <option value="ALL" selected>전체 코치 보기</option>
        </select>
      </div>
      <div class="col-6 col-md-3 pt-md-3">
        <button id="addScheduleBtn" class="btn btn-primary w-100" onclick="openAddModal()">
          + 일정 직접 추가
        </button>
      </div>
    </div>
  </div>

  <div id="calendar"></div>
</div>

<div class="modal fade" id="scheduleModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="modalTitle">일정 추가</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="scheduleForm">
          <input type="hidden" id="scheduleId">
          <input type="hidden" id="currentUnassignedDbId">
          <input type="hidden" id="modalTotalSessions" value="4">
          
          <div class="mb-3">
            <label class="form-label">지점</label>
            <select id="modalBranch" class="form-select" required>
              <option value="위례점">위례점</option>
              <option value="미사점">미사점</option>
              <option value="다산점">다산점</option>
            </select>
          </div>

          <div class="mb-3">
            <label id="modalNameLabel" class="form-label">이름</label>
            <input type="text" id="modalStudentName" class="form-control" placeholder="성함 입력" required>
          </div>

          <div id="consultPhoneGroup" class="mb-3 consulting-only-field practice-field d-none">
            <label class="form-label">연락처</label>
            <input type="text" id="modalPhone" class="form-control" placeholder="010-0000-0000">
          </div>

          <div class="mb-3 coach-field" id="coachSelectGroup">
            <label class="form-label">담당 코치</label>
            <select id="modalCoachName" class="form-select"></select>
          </div>

          <div class="mb-3">
            <label class="form-label" id="modalSubjectLabel">과목 / 레슨 구분</label>
            <select id="modalSubject" class="form-select" required onchange="calculateEndTime()"></select>
          </div>

          <div id="consultStatusGroup" class="mb-3 d-none">
            <label class="form-label">상담 진행 상태</label>
            <select id="modalConsultStatus" class="form-select">
              <option value="예약완료" selected>📅 예약완료</option>
              <option value="상담완료(등록)">✅ 상담완료 (등록 완료)</option>
              <option value="상담완료(미등록)">💬 상담완료 (미등록)</option>
              <option value="취소">❌ 취소</option>
            </select>
          </div>

          <div class="mb-3 room-field" id="roomSelectGroup">
            <label class="form-label">방 번호(룸 / 연습실)</label>
            <select id="modalRoomName" class="form-select"></select>
          </div>

          <div class="mb-3">
            <label class="form-label">날짜</label>
            <input type="date" id="modalDate" class="form-control" required>
          </div>

          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label">시작 시간</label>
              <select id="modalStartTime" class="form-select" required onchange="calculateEndTime()"></select>
            </div>
            <div class="col-6 mb-3">
              <label class="form-label">종료 시간</label>
              <input type="time" id="modalEndTime" class="form-control" required>
            </div>
          </div>

          <div id="consultMemoGroup" class="mb-3 consulting-only-field practice-field d-none">
            <label class="form-label">특이사항 / 메모</label>
            <textarea id="modalMemo" class="form-control" rows="2" placeholder="전화번호, 기타 특이사항 입력"></textarea>
          </div>

          <div id="repeatSection" class="p-3 bg-dark border border-secondary rounded mb-3 lesson-only-field">
            <div class="form-check form-switch mb-0">
              <input class="form-check-input" type="checkbox" id="repeatScheduleCheck" onchange="toggleRepeatOptions()">
              <label class="form-check-label fw-bold text-warning small" for="repeatScheduleCheck">
                🔁 주마다 일정 자동 갱신/반복 (ON/OFF)
              </label>
            </div>
            <div id="repeatOptionsGroup" class="d-none mt-3 border-top border-secondary pt-2">
              <label class="form-label small text-secondary">등록할 연속 주차(총 회차 수):</label>
              <select id="repeatWeeksSelect" class="form-select form-select-sm">
                <option value="1">1주 (단일)</option>
                <option value="2">2주 (2회차)</option>
                <option value="3">3주 (3회차)</option>
                <option value="4" selected>4주 (4회차)</option>
                <option value="8">8주 (8회차)</option>
                <option value="12">12주 (12회차)</option>
                <option value="16">16주 (16회차)</option>
                <option value="20">20주 (20회차)</option>
                <option value="24">24주 (24회차)</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" id="deleteScheduleBtn" class="btn btn-danger me-auto d-none" style="border-radius:8px;" onclick="deleteSchedule()">삭제</button>
        <button type="button" class="btn btn-secondary" style="border-radius:8px;" data-bs-dismiss="modal">취소</button>
        <button type="button" id="saveScheduleBtn" class="btn btn-primary" onclick="saveSchedule()">스케줄 저장</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="coachModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">

<script>
  const SUPABASE_URL = 'https://vokwkupqqvpkifnaulrn.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_6oV8ES_Cz6BzemiBkDBCLA_wl_g_GQP';

      '+ 미정 레슨생 등록';

      el.style.display = (type === 'lesson') ? 'block' : 'none';

    document.querySelectorAll('.consulting-only-field').forEach(el => {

  function updateSubjectOptions() {
    const unSub = document.getElementById('unSubject');
    const modalSub = document.getElementById('modalSubject');
    let options = '';

    if (currentScheduleType === 'consulting') {
      options = `
        <option value="상담" selected>방문 상담 (15분)</option>
        <option value="체험">체험 레슨 (30분)</option>
      `;
    } else if (currentScheduleType === 'practice') {
      options = `
        <option value="1시간 대여" selected>1시간 대여 (60분)</option>
        <option value="1.5시간 대여">1.5시간 대여 (90분)</option>
        <option value="2시간 대여">2시간 대여 (120분)</option>
        <option value="3시간 대여">3시간 대여 (180분)</option>
      `;

        <option value="스타일" selected>스타일 (50분)</option>
        <option value="보컬 메이킹">보컬 메이킹 (50분)</option>
        <option value="2:1 그룹">2:1 그룹 (55분)</option>

    }

    if (unSub) unSub.innerHTML = options;
    if (modalSub) modalSub.innerHTML = options;
  }

  function calculateEndTime() {
    const subject = document.getElementById('modalSubject').value;
    const startTimeStr = document.getElementById('modalStartTime').value;
    
    if (!startTimeStr) return;

    const durationMinutes = DURATION_MAP[subject] || 60;
    const [hours, minutes] = startTimeStr.split(':').map(Number);

    const date = new Date();
    date.setHours(hours, minutes, 0, 0);
    date.setMinutes(date.getMinutes() + durationMinutes);

    const endHours = String(date.getHours()).padStart(2, '0');
    const endMinutes = String(date.getMinutes()).padStart(2, '0');

    document.getElementById('modalEndTime').value = `${endHours}:${endMinutes}`;
  }

  function formatKST(dateInput) {
    const d = new Date(dateInput);
    const kstTime = new Date(d.getTime() + (9 * 60 * 60 * 1000) + (d.getTimezoneOffset() * 60 * 1000));
    const year = kstTime.getFullYear();
    const month = String(kstTime.getMonth() + 1).padStart(2, '0');
    const day = String(kstTime.getDate()).padStart(2, '0');
    const hours = String(kstTime.getHours()).padStart(2, '0');
    const minutes = String(kstTime.getMinutes()).padStart(2, '0');
    return {
      date: `${year}-${month}-${day}`,
      time: `${hours}:${minutes}`
    };
  }

  function formatDateIso(dateObj) {
    const year = dateObj.getFullYear();
    const month = String(dateObj.getMonth() + 1).padStart(2, '0');
    const day = String(dateObj.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function toggleRepeatOptions() {
    const chk = document.getElementById('repeatScheduleCheck');
    const group = document.getElementById('repeatOptionsGroup');
    if (chk && group) {
      group.classList.toggle('d-none', !chk.checked);
    }
  }

  function populateTimeOptions() {
    const startSelect = document.getElementById('modalStartTime');
    if (!startSelect) return;

    startSelect.innerHTML = '';

    for (let h = 10; h <= 23; h++) {
      ['00', '10', '20', '30', '40', '50'].forEach(m => {
        const timeStr = `${String(h).padStart(2, '0')}:${m}`;
        startSelect.innerHTML += `<option value="${timeStr}">${timeStr}</option>`;
      });
    }
  }

  document.addEventListener('DOMContentLoaded', async function() {
    populateTimeOptions();
    updateRoomOptions();
    updateSubjectOptions();
    checkAuthStatus();

  function checkAuthStatus() {
    const currentUser = JSON.parse(sessionStorage.getItem('loginUser'));
    const loginView = document.getElementById('loginView');
    const mainApp = document.getElementById('mainApp');
    const userInfo = document.getElementById('userInfo');
    const manageCoachBtn = document.getElementById('manageCoachBtn');

      loginView.classList.add('d-none');

  function toggleUnassignedForm() {
    const form = document.getElementById('unassignedForm');
    form.classList.toggle('d-none');
  }

  async function loadUnassignedStudents() {
    const { data, error } = await sbClient
      .from('unassigned_students')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      console.error('미정 목록 불러오기 오류:', error);
      return;
    }

    unassignedStudents = (data || []).filter(item => {
      const type = item.schedule_type || (item.subject?.includes('대여') ? 'practice' : (item.subject === '상담' || item.subject === '체험' ? 'consulting' : 'lesson'));
      return currentScheduleType === type;
    });

    renderUnassignedList();
  }

  async function addUnassignedStudent() {
    const branch = document.getElementById('unBranch').value;
    const name = document.getElementById('unStudentName').value.trim();
    const phone = document.getElementById('unPhone')?.value.trim() || '';
    
    const currentUser = JSON.parse(sessionStorage.getItem('loginUser'));
    const coach = (currentScheduleType === 'practice') ? '연습실' : ((currentUser && currentUser.role !== 'admin') ? currentUser.name : document.getElementById('unCoachName').value);
    
    const subject = document.getElementById('unSubject').value;
    const room = currentScheduleType === 'consulting' ? '상담실' : (document.getElementById('unRoomName')?.value || '연습실');

    const sessionEl = document.getElementById('unSessions');
    const total_sessions = currentScheduleType === 'lesson' ? (sessionEl ? parseInt(sessionEl.value, 10) : 4) : 1;

    if (!name) {
      alert('성함을 입력해주세요.');
      return;
    }

    const payload = { 
      branch, 
      name, 
      phone,
      coach, 
      subject, 
      room, 
      total_sessions,
      completed_sessions: 0,
      remaining_sessions: total_sessions,
      schedule_type: currentScheduleType
    };

    const { error } = await sbClient.from('unassigned_students').insert([payload]);

    if (error) {
      alert('저장 실패: ' + error.message);
      return;
    }

    alert(`${name} 님이 미정 목록에 등록되었습니다.`);
    document.getElementById('unStudentName').value = '';
    if(document.getElementById('unPhone')) document.getElementById('unPhone').value = '';
    toggleUnassignedForm();
    await loadUnassignedStudents();
  }

  function renderUnassignedList() {
    const container = document.getElementById('unassignedList');
    const filterVal = document.getElementById('unassignedCoachFilter').value;
    if (!container) return;

    if (unassignedStudents.length === 0) {
      container.innerHTML = `<div class="small text-secondary py-1">대기 중인 ${currentScheduleType === 'practice' ? '연습실' : (currentScheduleType === 'consulting' ? '상담/체험' : '레슨')} 미정 목록이 없습니다.</div>`;
      return;
    }

    let filteredList = unassignedStudents;
    if (currentScheduleType !== 'practice' && filterVal !== 'ALL') {
      filteredList = unassignedStudents.filter(s => s.coach === filterVal);
    }

    const grouped = {};
    filteredList.forEach(s => {
      const groupKey = currentScheduleType === 'practice' ? '연습실 대여' : (s.coach || '미지정');
      if (!grouped[groupKey]) grouped[groupKey] = [];
      grouped[groupKey].push(s);
    });

    container.innerHTML = '';

    Object.keys(grouped).forEach(groupKey => {
      const groupColor = currentScheduleType === 'practice' ? '#10b981' : (coachMap[groupKey] || '#f59e0b');
      let cardsHtml = '';

      grouped[groupKey].forEach(s => {
        cardsHtml += `
          <div class="unassigned-card">

              <span class="badge bg-secondary me-1">${s.branch}</span>

              <span class="text-secondary">(${s.room || '연습실'})</span>

            <div>
              <button class="btn btn-sm btn-warning py-1 px-3" style="font-size:0.8rem; font-weight:600;" onclick="selectUnassignedStudent(${s.id})">👉 일정 지정</button>

            </div>

        `;

      container.innerHTML += `

            <span style="display:inline-block; width:10px; height:10px; border-radius:50%; background-color:${groupColor};"></span>

          </div>

        </div>
      `;
    });

  async function removeUnassigned(dbId) {
    if (!confirm('이 목록을 삭제하시겠습니까?')) return;

  function initCalendar() {
    const calendarEl = document.getElementById('calendar');
    if (!calendarEl) return;

    if (calendar) {
      calendar.refetchEvents();
      return;
    }

    const isMobile = window.innerWidth <= 768;

    calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: isMobile ? 'timeGridDay' : 'timeGridWeek',
      locale: 'ko',
      height: '700px',
      displayEventTime: false,

      // 날짜 헤더 이미지 형태 반영 (예: 8. 24. (월))
      dayHeaderContent: function(arg) {
        const d = arg.date;
        const month = d.getMonth() + 1;
        const date = d.getDate();
        const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
        const dayName = dayNames[d.getDay()];
        return `${month}. ${date}. (${dayName})`;
      },

      buttonText: { today: '오늘', month: '월', week: '주', day: '일' },
      headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: 'dayGridMonth,timeGridWeek,timeGridDay'
      },
      slotMinTime: '10:00:00',
      slotMaxTime: '23:00:00',
      allDaySlot: false,
      slotDuration: '00:30:00',
      slotLabelInterval: '01:00:00',
      
      events: async function(fetchInfo, successCallback, failureCallback) {
        try {
          const selectedBranch = document.getElementById('branchSelect').value;
          const selectedRoom = document.getElementById('roomSelect').value;
          const selectedCoach = document.getElementById('coachFilter').value;

          let query = sbClient.from('schedules').select('*').eq('branch', selectedBranch);

          if (currentScheduleType !== 'consulting' && selectedRoom !== 'ALL') {
            query = query.eq('room_name', selectedRoom);
          }
          if (currentScheduleType !== 'practice' && selectedCoach !== 'ALL') {
            query = query.eq('coach_name', selectedCoach);
          }

          const { data: schedulesData, error } = await query;
          if (error) throw error;

          const filteredData = (schedulesData || []).filter(item => {
            const type = item.schedule_type || (item.subject?.includes('대여') ? 'practice' : (item.subject === '상담' || item.subject === '체험' ? 'consulting' : 'lesson'));
            return currentScheduleType === type;
          });

          if (currentScheduleType === 'lesson') {
            const studentSchedulesMap = {};
            filteredData.forEach(item => {
              if (item.student_name && !item.student_name.includes('미정')) {
                const key = `${item.student_name}_${item.coach_name}`;
                if (!studentSchedulesMap[key]) studentSchedulesMap[key] = [];
                studentSchedulesMap[key].push(item);
              }
            });

            Object.keys(studentSchedulesMap).forEach(key => {
              studentSchedulesMap[key].sort((a, b) => new Date(a.start_time) - new Date(b.start_time));
              const total = studentSchedulesMap[key][0]?.total_sessions || studentSchedulesMap[key].length;

              studentSchedulesMap[key].forEach((item, index) => {
                item._session_no = index + 1;
                item._total_sessions = item.total_sessions || total;
              });
            });
          }

          // 순번 부여
          filteredData.sort((a, b) => new Date(a.start_time) - new Date(b.start_time));

          const events = filteredData.map((item, index) => {
            const isUnassigned = !item.student_name || item.student_name.includes('미정');
            
            let roomNum = item.room_name || '';
            if (roomNum.includes('ROOM')) {
              roomNum = roomNum.replace('ROOM', '').trim();
            }

            let displayTitle = '';
            let eventBgColor = coachMap[item.coach_name] || '#5046e5';

            const seqNum = index + 1;

            if (currentScheduleType === 'practice') {
              displayTitle = `${seqNum}. 연습실. ${item.student_name || '이용자'}(${item.coach_name || '코치'}) 1/1회`;
              eventBgColor = '#10b981';
            } else if (currentScheduleType === 'consulting') {
              const statusTag = item.consult_status ? `[${item.consult_status}]` : `[${item.subject || '상담'}]`;
              displayTitle = `${seqNum}. ${item.student_name || '신청자'}(${item.coach_name}) ${statusTag}`;
              eventBgColor = item.consult_status === '취소' ? '#4b5563' : (item.subject === '체험' ? '#f59e0b' : '#ec4899');
            } else {
              const sessionText = item._session_no ? `${item._session_no}/${item._total_sessions || 4}회` : '1회';
              displayTitle = `${seqNum}. ${item.student_name || '미정'}(${item.coach_name}) ${sessionText}`;
            }

            return {
              id: item.id,
              title: displayTitle,
              start: item.start_time,
              end: item.end_time,
              backgroundColor: isUnassigned ? '#1c1d22' : eventBgColor,
              borderColor: '#ffffff',
              classNames: isUnassigned ? ['fc-event-unassigned'] : [],
              extendedProps: item
            };
          });

          successCallback(events);
        } catch (err) {
          console.error("스케줄 로딩 오류:", err);
          failureCallback(err);
        }
      },

      // 이미지와 동일하게 텍스트 가독성을 최상으로 맞춘 렌더링
      eventContent: function(arg) {
        return {
          html: `<div style="font-weight: 800; color: #ffffff; text-shadow: 0 1px 2px rgba(0,0,0,0.6); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${arg.event.title}</div>`
        };
      },

      eventClick: function(info) {
        openEditModal(info.event.extendedProps);
      }
    });

    calendar.render();

    document.getElementById('branchSelect').addEventListener('change', () => calendar.refetchEvents());
    document.getElementById('roomSelect').addEventListener('change', () => calendar.refetchEvents());
    document.getElementById('coachFilter').addEventListener('change', () => calendar.refetchEvents());
  }

  async function loadCoachesData() {
    const { data: coaches, error } = await sbClient.from('coaches').select('*');
    if (error) {
      console.error('코치 목록 불러오기 오류:', error);
      return;
    }

    const coachFilter = document.getElementById('coachFilter');
    const unassignedCoachFilter = document.getElementById('unassignedCoachFilter');
    const modalCoachName = document.getElementById('modalCoachName');
    const unCoachName = document.getElementById('unCoachName');

    if (coachFilter) coachFilter.innerHTML = '<option value="ALL" selected>전체 코치 보기</option>';
    if (unassignedCoachFilter) unassignedCoachFilter.innerHTML = '<option value="ALL" selected>전체 코치 보기</option>';
    if (modalCoachName) modalCoachName.innerHTML = '';
    if (unCoachName) unCoachName.innerHTML = '';
    coachMap = {};

    (coaches || []).forEach(c => {
      coachMap[c.name] = c.color || '#4f46e5';
      if (coachFilter) coachFilter.innerHTML += `<option value="${c.name}">${c.name}</option>`;
      if (unassignedCoachFilter) unassignedCoachFilter.innerHTML += `<option value="${c.name}">${c.name}</option>`;
      if (modalCoachName) modalCoachName.innerHTML += `<option value="${c.name}">${c.name}</option>`;
      if (unCoachName) unCoachName.innerHTML += `<option value="${c.name}">${c.name}</option>`;
    });

    const coachTableBody = document.getElementById('coachTableBody');
    if (coachTableBody) {
      coachTableBody.innerHTML = '';

      (coaches || []).forEach(c => {
        const branchBadges = (c.branch || '위례점')
          .split(',')
          .map(b => `<span class="badge bg-secondary me-1">${b.trim()}</span>`)
          .join('');

        coachTableBody.innerHTML += `
          <tr>
            <td>${branchBadges}</td>
            <td class="fw-bold">${c.name}</td>
            <td>${c.email || c.username || '-'}</td>
            <td><code>${c.password || '*****'}</code></td>
            <td>${c.role === 'admin' ? '<span class="badge bg-danger">관리자</span>' : '<span class="badge bg-primary">코치</span>'}</td>
            <td><div style="width:20px; height:20px; background-color:${c.color || '#4f46e5'}; border-radius:4px;"></div></td>
            <td><button class="btn btn-sm btn-outline-danger" style="border-radius:6px;" onclick="deleteCoach('${c.id}')">삭제</button></td>
          </tr>
        `;
      });
    }
  }

  async function handleLogin() {
    const idInput = document.getElementById('loginEmail').value.trim();
    const pwInput = document.getElementById('loginPassword').value.trim();

    if (!idInput || !pwInput) {
      alert("아이디와 비밀번호를 모두 입력해 주세요.");
      return;
    }

    if (idInput === 'admin' && pwInput === '1234') {
      const userData = { id: 'admin', name: '관리자', role: 'admin' };
      sessionStorage.setItem('loginUser', JSON.stringify(userData));
      checkAuthStatus();
      return;
    }

    const { data: coaches, error } = await sbClient
      .from('coaches')
      .select('*')
      .or(`email.eq.${idInput},username.eq.${idInput}`)
      .eq('password', pwInput);

    if (error) {
      alert('로그인 오류: ' + error.message);
      return;
    }

    if (coaches && coaches.length > 0) {
      const matchedCoach = coaches[0];
      const userData = {
        id: matchedCoach.id,
        name: matchedCoach.name,
        role: matchedCoach.role || 'coach',
        branch: matchedCoach.branch
      };
      sessionStorage.setItem('loginUser', JSON.stringify(userData));
      checkAuthStatus();
    } else {
      alert('아이디 또는 비밀번호가 올바르지 않습니다.');
    }
  }

  function handleLogout() {
    sessionStorage.removeItem('loginUser');
    location.reload();
  }

  function applyCoachRestriction() {
    const currentUser = JSON.parse(sessionStorage.getItem('loginUser'));
    const modalCoachName = document.getElementById('modalCoachName');
    const unCoachName = document.getElementById('unCoachName');
    const coachFilter = document.getElementById('coachFilter');
    const unassignedCoachFilter = document.getElementById('unassignedCoachFilter');

    if (currentUser && currentUser.role !== 'admin') {
      if (modalCoachName) {
        modalCoachName.value = currentUser.name;
        modalCoachName.disabled = true;
        modalCoachName.classList.add('readonly-select');
      }
      if (unCoachName) {
        unCoachName.value = currentUser.name;
        unCoachName.disabled = true;
        unCoachName.classList.add('readonly-select');
      }
      if (coachFilter) {
        coachFilter.value = currentUser.name;
        coachFilter.disabled = true;
        coachFilter.classList.add('readonly-select');
      }
      if (unassignedCoachFilter) {
        unassignedCoachFilter.value = currentUser.name;
        unassignedCoachFilter.disabled = true;
        unassignedCoachFilter.classList.add('readonly-select');
      }
    } else {
      if (modalCoachName) {
        modalCoachName.disabled = false;
        modalCoachName.classList.remove('readonly-select');
      }
      if (unCoachName) {
        unCoachName.disabled = false;
        unCoachName.classList.remove('readonly-select');
      }
      if (coachFilter) {
        coachFilter.disabled = false;
        coachFilter.classList.remove('readonly-select');
      }
      if (unassignedCoachFilter) {
        unassignedCoachFilter.disabled = false;
        unassignedCoachFilter.classList.remove('readonly-select');
      }
    }
  }

  function setupModalView(type) {
    const isConsulting = (type === 'consulting');
    const isPractice = (type === 'practice');

    document.getElementById('modalNameLabel').innerText = 
      isConsulting ? '상담/체험 신청자 이름' :
      isPractice ? '연습실 이용자 이름' : '수강생 이름';

    document.getElementById('modalSubjectLabel').innerText = 
      isPractice ? '연습실 이용 시간' :
      isConsulting ? '상담 / 체험 구분' : '과목 / 레슨 구분';

    document.querySelectorAll('.consulting-only-field').forEach(el => {
      el.classList.toggle('d-none', !isConsulting);
    });

    document.querySelectorAll('.practice-field').forEach(el => {
      if (isPractice) el.classList.remove('d-none');
    });

    document.querySelectorAll('.coach-field').forEach(el => {
      el.style.display = isPractice ? 'none' : 'block';
    });

    document.querySelectorAll('.lesson-only-field').forEach(el => {
      el.style.display = (type === 'lesson') ? 'block' : 'none';
    });

    updateRoomOptions();
    updateSubjectOptions();
  }

  function openAddModal() {
    document.getElementById('modalTitle').innerText = 
      currentScheduleType === 'consulting' ? "상담/체험 일정 추가" :
      currentScheduleType === 'practice' ? "연습실 대여 추가" : "레슨 일정 추가";

    document.getElementById('scheduleId').value = "";
    document.getElementById('currentUnassignedDbId').value = "";
    document.getElementById('modalTotalSessions').value = currentScheduleType === 'lesson' ? "4" : "1";
    document.getElementById('modalStudentName').value = "";
    document.getElementById('modalPhone').value = "";
    document.getElementById('modalMemo').value = "";
    
    setupModalView(currentScheduleType);

    const nowKST = formatKST(new Date());
    document.getElementById('modalDate').value = nowKST.date;
    document.getElementById('modalStartTime').value = "10:00";
    
    calculateEndTime();

    document.getElementById('deleteScheduleBtn').classList.add('d-none');
    const repeatChk = document.getElementById('repeatScheduleCheck');
    if (repeatChk) repeatChk.checked = false;
    toggleRepeatOptions();

    applyCoachRestriction();
    new bootstrap.Modal(document.getElementById('scheduleModal')).show();
  }

  function openEditModal(scheduleData) {
    const type = scheduleData.schedule_type || (scheduleData.subject?.includes('대여') ? 'practice' : (scheduleData.subject === '상담' || scheduleData.subject === '체험' ? 'consulting' : 'lesson'));
    setupModalView(type);

    document.getElementById('modalTitle').innerText = 
      type === 'consulting' ? "상담/체험 일정 수정" :
      type === 'practice' ? "연습실 대여 수정" : "레슨 일정 수정";

    document.getElementById('scheduleId').value = scheduleData.id;
    document.getElementById('currentUnassignedDbId').value = "";
    document.getElementById('modalTotalSessions').value = scheduleData.total_sessions || 1;
    document.getElementById('modalBranch').value = scheduleData.branch || '위례점';
    document.getElementById('modalStudentName').value = scheduleData.student_name;
    
    if (type !== 'practice' && document.getElementById('modalCoachName')) {
      document.getElementById('modalCoachName').value = scheduleData.coach_name;
    }
    
    document.getElementById('modalSubject').value = scheduleData.subject || (type === 'practice' ? '1시간 대여' : (type === 'consulting' ? '상담' : '스타일'));
    
    if (document.getElementById('modalRoomName')) {
      document.getElementById('modalRoomName').value = scheduleData.room_name || '연습실';
    }
    
    if (type === 'consulting' || type === 'practice') {
      document.getElementById('modalPhone').value = scheduleData.phone || '';
      document.getElementById('modalMemo').value = scheduleData.memo || '';
    }

    if (type === 'consulting') {
      document.getElementById('modalConsultStatus').value = scheduleData.consult_status || '예약완료';
    }

    if (scheduleData.start_time) {
      const startKST = formatKST(scheduleData.start_time);
      document.getElementById('modalDate').value = startKST.date;
      document.getElementById('modalStartTime').value = startKST.time;
    }

    if (scheduleData.end_time) {
      const endKST = formatKST(scheduleData.end_time);
      document.getElementById('modalEndTime').value = endKST.time;
    } else {
      calculateEndTime();
    }

    document.getElementById('deleteScheduleBtn').classList.remove('d-none');
    const repeatChk = document.getElementById('repeatScheduleCheck');
    if (repeatChk) repeatChk.checked = false;
    toggleRepeatOptions();

    applyCoachRestriction();
    new bootstrap.Modal(document.getElementById('scheduleModal')).show();
  }

  async function saveSchedule() {
    const id = document.getElementById('scheduleId').value;
    const unassignedDbId = document.getElementById('currentUnassignedDbId').value;
    const totalSessionsVal = parseInt(document.getElementById('modalTotalSessions').value, 10) || 1;
    
    const branch = document.getElementById('modalBranch').value;
    const student_name = document.getElementById('modalStudentName').value.trim();
    
    const currentUser = JSON.parse(sessionStorage.getItem('loginUser'));
    const coach_name = (currentScheduleType === 'practice') ? '연습실' : ((currentUser && currentUser.role !== 'admin') ? currentUser.name : document.getElementById('modalCoachName').value);
    
    const subject = document.getElementById('modalSubject').value;
    const room_name = currentScheduleType === 'consulting' ? '상담실' : (document.getElementById('modalRoomName')?.value || '연습실');
    
    const selectedDate = document.getElementById('modalDate').value;
    const startTime = document.getElementById('modalStartTime').value;
    const endTime = document.getElementById('modalEndTime').value;

    const phone = document.getElementById('modalPhone')?.value.trim() || '';
    const consult_status = document.getElementById('modalConsultStatus')?.value || '';
    const memo = document.getElementById('modalMemo')?.value.trim() || '';

    const isRepeat = document.getElementById('repeatScheduleCheck')?.checked;
    const repeatWeeks = parseInt(document.getElementById('repeatWeeksSelect')?.value, 10) || 1;

    if (!student_name || !selectedDate || !startTime || !endTime) {
      alert("이름, 날짜 및 시간을 정확히 입력해 주세요.");
      return;
    }

    if (startTime >= endTime) {
      alert("종료 시간은 시작 시간보다 이후여야 합니다.");
      return;
    }

    const start_time = `${selectedDate}T${startTime}:00+09:00`;
    const end_time = `${selectedDate}T${endTime}:00+09:00`;

    const payload = { 
      branch, 
      student_name, 
      coach_name, 
      subject, 
      room_name, 
      start_time, 
      end_time, 
      total_sessions: totalSessionsVal,
      schedule_type: currentScheduleType,
      phone,
      consult_status,
      memo
    };

    if (id) {
      const result = await sbClient.from('schedules').update(payload).eq('id', id);
      if (result.error) {
        alert("수정 실패: " + result.error.message);
      } else {
        const modalEl = document.getElementById('scheduleModal');
        const modalInstance = bootstrap.Modal.getInstance(modalEl);
        if (modalInstance) modalInstance.hide();
        calendar.refetchEvents();
      }
      return;
    }

    const weeksToCreate = (currentScheduleType === 'lesson' && isRepeat) ? repeatWeeks : 1;
    const schedulesToInsert = [];
    const baseDate = new Date(selectedDate);

    for (let i = 0; i < weeksToCreate; i++) {
      const currDateObj = new Date(baseDate);
      currDateObj.setDate(baseDate.getDate() + (i * 7));
      const currDateStr = formatDateIso(currDateObj);

      schedulesToInsert.push({ 
        ...payload,
        start_time: `${currDateStr}T${startTime}:00+09:00`,
        end_time: `${currDateStr}T${endTime}:00+09:00`
      });
    }

    const { error: insertError } = await sbClient.from('schedules').insert(schedulesToInsert);

    if (insertError) {
      alert("일정 저장 실패: " + insertError.message);
    } else {
      if (unassignedDbId) {
        await sbClient.from('unassigned_students').delete().eq('id', unassignedDbId);
        await loadUnassignedStudents();
      }

      alert('스케줄이 성공적으로 저장되었습니다.');

      const modalEl = document.getElementById('scheduleModal');
      const modalInstance = bootstrap.Modal.getInstance(modalEl);
      if (modalInstance) modalInstance.hide();
      calendar.refetchEvents();
    }
  }

  async function deleteSchedule() {
    const id = document.getElementById('scheduleId').value;
    if (!id || !confirm("정말 이 일정을 삭제하시겠습니까?")) return;

    const { error: deleteError } = await sbClient.from('schedules').delete().eq('id', id);
    if (deleteError) {
      alert("삭제 실패: " + deleteError.message);
      return;
    }

    alert("일정이 삭제되었습니다.");

    const modalEl = document.getElementById('scheduleModal');
    const modalInstance = bootstrap.Modal.getInstance(modalEl);
    if (modalInstance) modalInstance.hide();

    await loadUnassignedStudents();
    calendar.refetchEvents();
  }

  async function registerNewCoach() {
    const checkedBranches = Array.from(document.querySelectorAll('.new-coach-branch:checked')).map(cb => cb.value);
    if (checkedBranches.length === 0) {
      alert('최소 하나 이상의 담당 지점을 선택해 주세요.');
      return;
    }

    const branch = checkedBranches.join(', ');
    const name = document.getElementById('newCoachName').value.trim();
    const email = document.getElementById('newCoachEmail').value.trim();
    const password = document.getElementById('newCoachPassword').value.trim();
    const role = document.getElementById('newCoachRole').value;
    const color = document.getElementById('newCoachColor').value;

    if (!name || !email || !password) {
      alert('코치 이름, 아이디, 비밀번호를 모두 입력해 주세요.');
      return;
    }

    const payload = { 
      branch, 
      name, 
      username: email,
      email: email, 
      password, 
      role, 
      color 
    };

    const { error } = await sbClient.from('coaches').insert([payload]);
    if (error) {
      alert('코치 등록 실패: ' + error.message);
    } else {
      alert(`${name} 코치(${branch})가 등록되었습니다.`);
      document.getElementById('newCoachName').value = '';
      document.getElementById('newCoachEmail').value = '';
      document.getElementById('newCoachPassword').value = '';
      await loadCoachesData();
    }
  }

  async function deleteCoach(id) {
    if (!confirm('정말 이 코치 계정을 삭제하시겠습니까?')) return;
    const { error } = await sbClient.from('coaches').delete().eq('id', id);
    if (error) {
      alert('삭제 실패: ' + error.message);
    } else {
      await loadCoachesData();
    }
  }
</script>
