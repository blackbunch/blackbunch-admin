<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>블랙번치 스튜디오 일정 관리 시스템</title>
  
  <!-- FullCalendar CSS -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/main.min.css" rel="stylesheet" />
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <style>
    body {
      padding: 20px;
      background-color: #f8f9fa;
    }
    .main-container {
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    #calendar {
      margin-top: 20px;
      min-height: 700px;
    }
    .filter-section {
      background-color: #f1f3f5;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .branch-checkbox-group {
      display: flex;
      gap: 12px;
      align-items: center;
      padding-top: 4px;
    }
  </style>
</head>
<body>

<div class="main-container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>🎵 블랙번치 스튜디오 스케줄 관리</h2>
    <div id="authContainer" class="d-flex align-items-center gap-2">
      <!-- 로그인 / 사용자 상태 표시 -->
      <button id="manageCoachBtn" class="btn btn-outline-dark btn-sm d-none" data-bs-toggle="modal" data-bs-target="#coachModal">
        ⚙️ 코치 관리
      </button>
      <span id="userInfo" class="fw-bold me-2"></span>
      <button id="authBtn" class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#loginModal">로그인</button>
    </div>
  </div>

  <!-- 필터 섹션 (지점, 룸, 코치) -->
  <div class="filter-section">
    <div class="row g-3 align-items-center">
      <div class="col-md-3">
        <label for="branchSelect" class="form-label fw-bold">📍 지점 선택</label>
        <select id="branchSelect" class="form-select">
          <option value="위례점" selected>위례점</option>
          <option value="미사점">미사점</option>
          <option value="다산점">다산점</option>
        </select>
      </div>
      <div class="col-md-3">
        <label for="roomSelect" class="form-label fw-bold">🚪 연습실/레슨실 선택</label>
        <select id="roomSelect" class="form-select">
          <option value="ALL" selected>전체 룸 보기</option>
          <option value="ROOM 1">ROOM 1</option>
          <option value="ROOM 2">ROOM 2</option>
          <option value="ROOM 3">ROOM 3</option>
          <option value="ROOM 4">ROOM 4</option>
          <option value="ROOM 5">ROOM 5</option>
        </select>
      </div>
      <div class="col-md-3">
        <label for="coachFilter" class="form-label fw-bold">🎤 코치 필터</label>
        <select id="coachFilter" class="form-select">
          <option value="ALL" selected>전체 코치 보기</option>
        </select>
      </div>
      <div class="col-md-3 text-end pt-4">
        <button id="addScheduleBtn" class="btn btn-primary" onclick="openAddModal()">
          + 일정 추가
        </button>
      </div>
    </div>
  </div>

  <!-- 캘린더 영역 -->
  <div id="calendar"></div>
</div>

<!-- 로그인 모달 -->
<div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">로그인</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">이메일</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="coach@blackbunch.com">
        </div>
        <div class="mb-3">
          <label class="form-label">비밀번호</label>
          <input type="password" id="loginPassword" class="form-control">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
        <button type="button" class="btn btn-primary" onclick="handleLogin()">로그인</button>
      </div>
    </div>
  </div>
</div>

<!-- 일정 추가/수정 모달 -->
<div class="modal fade" id="scheduleModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">일정 추가</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="scheduleForm">
          <input type="hidden" id="scheduleId">
          
          <div class="mb-3">
            <label class="form-label">지점</label>
            <select id="modalBranch" class="form-select" required>
              <option value="위례점">위례점</option>
              <option value="미사점">미사점</option>
              <option value="다산점">다산점</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">학생 이름</label>
            <input type="text" id="modalStudentName" class="form-control" placeholder="학생 성함 입력" required>
          </div>

          <div class="mb-3">
            <label class="form-label">담당 코치</label>
            <select id="modalCoachName" class="form-select" required>
              <!-- JS로 동적 로드 -->
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">과목 / 레슨 내용</label>
            <input type="text" id="modalSubject" class="form-control" placeholder="예: 보컬 레슨 / 발성 교정">
          </div>

          <div class="mb-3">
            <label class="form-label">방 번호(룸)</label>
            <select id="modalRoomName" class="form-select" required>
              <option value="ROOM 1">ROOM 1</option>
              <option value="ROOM 2">ROOM 2</option>
              <option value="ROOM 3">ROOM 3</option>
              <option value="ROOM 4">ROOM 4</option>
              <option value="ROOM 5">ROOM 5</option>
            </select>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">시작 시간</label>
              <input type="datetime-local" id="modalStartTime" class="form-control" required>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">종료 시간</label>
              <input type="datetime-local" id="modalEndTime" class="form-control" required>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" id="deleteScheduleBtn" class="btn btn-danger d-none" onclick="deleteSchedule()">삭제</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
        <button type="button" id="saveScheduleBtn" class="btn btn-primary" onclick="saveSchedule()">저장</button>
      </div>
    </div>
  </div>
</div>

<!-- ⚙️ 코치 등록/관리 모달 -->
<div class="modal fade" id="coachModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">코치 계정 등록 및 관리</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="coachForm" class="p-3 bg-light rounded mb-4">
          <h6 class="fw-bold mb-3">➕ 새 코치 등록</h6>
          <div class="row g-3 mb-2">
            <div class="col-md-12">
              <label class="form-label small fw-bold">담당 지점 (중복 선택 가능)</label>
              <div class="branch-checkbox-group">
                <div class="form-check form-check-inline">
                  <input class="form-check-input new-coach-branch" type="checkbox" id="chkWirye" value="위례점" checked>
                  <label class="form-check-label" for="chkWirye">위례점</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input new-coach-branch" type="checkbox" id="chkMisa" value="미사점">
                  <label class="form-check-label" for="chkMisa">미사점</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input new-coach-branch" type="checkbox" id="chkDasan" value="다산점">
                  <label class="form-check-label" for="chkDasan">다산점</label>
                </div>
              </div>
            </div>
          </div>
          <div class="row g-3">
            <div class="col-md-3">
              <label class="form-label small fw-bold">코치 이름</label>
              <input type="text" id="newCoachName" class="form-control form-control-sm" placeholder="예: 김보컬" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-bold">이메일 계정</label>
              <input type="email" id="newCoachEmail" class="form-control form-control-sm" placeholder="coach@blackbunch.com" required>
            </div>
            <div class="col-md-2">
              <label class="form-label small fw-bold">권한</label>
              <select id="newCoachRole" class="form-select form-select-sm">
                <option value="coach" selected>코치</option>
                <option value="admin">관리자</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-bold">캘린더 색상</label>
              <input type="color" id="newCoachColor" class="form-control form-control-color w-100" value="#3788d8">
            </div>
            <div class="col-md-12 text-end mt-3">
              <button type="button" id="saveCoachBtn" class="btn btn-sm btn-success px-4" onclick="registerNewCoach()">코치 추가</button>
            </div>
          </div>
        </form>

        <h6>📋 등록된 코치 목록</h6>
        <div class="table-responsive">
          <table class="table table-bordered table-hover align-middle small">
            <thead class="table-dark">
              <tr>
                <th>담당 지점</th>
                <th>이름</th>
                <th>이메일</th>
                <th>권한</th>
                <th>색상</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody id="coachTableBody">
              <!-- JS 로드 -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- FullCalendar & Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Supabase JS Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = 'https://vokwkupqqvpkifnaulrn.supabase.co'; 
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZva3drdXBxcXZwa2lmbmF1bHJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MDM5NzUsImV4cCI6MjEwMjE3OTk3NX0.hyu9bzJ3P4I3y9Q4N5VnlsF189nx3cGS9GnAKvpT4bk';
  
  // supabase 변수명 충돌 해결을 위해 supabaseClient 로 지정
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let calendar;
  let coachMap = {};

  document.addEventListener('DOMContentLoaded', async function() {
    const calendarEl = document.getElementById('calendar');

    calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'timeGridWeek',
      locale: 'ko',
      headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: 'dayGridMonth,timeGridWeek,timeGridDay'
      },
      slotMinTime: '10:00:00',
      slotMaxTime: '24:00:00',
      allDaySlot: false,
      slotDuration: '00:30:00',
      
      events: async function(fetchInfo, successCallback, failureCallback) {
        try {
          const selectedBranch = document.getElementById('branchSelect').value;
          const selectedRoom = document.getElementById('roomSelect').value;
          const selectedCoach = document.getElementById('coachFilter').value;

          let query = supabaseClient.from('schedules').select('*').eq('branch', selectedBranch);

          if (selectedRoom !== 'ALL') {
            query = query.eq('room_name', selectedRoom);
          }
          if (selectedCoach !== 'ALL') {
            query = query.eq('coach_name', selectedCoach);
          }

          const { data, error } = await query;
          if (error) throw error;

          const events = (data || []).map(item => ({
            id: item.id,
            title: `[${item.room_name}] ${item.student_name} (${item.coach_name})`,
            start: item.start_time,
            end: item.end_time,
            backgroundColor: coachMap[item.coach_name] || '#3788d8',
            borderColor: coachMap[item.coach_name] || '#3788d8',
            extendedProps: item
          }));

          successCallback(events);
        } catch (err) {
          console.error("스케줄 로딩 오류:", err);
          failureCallback(err);
        }
      },

      eventClick: function(info) {
        openEditModal(info.event.extendedProps);
      }
    });

    calendar.render();

    document.getElementById('branchSelect').addEventListener('change', () => calendar.refetchEvents());
    document.getElementById('roomSelect').addEventListener('change', () => calendar.refetchEvents());
    document.getElementById('coachFilter').addEventListener('change', () => calendar.refetchEvents());

    await loadCoachesData();
    await checkAuthStatus();
  });

  async function loadCoachesData() {
    const { data: coaches, error } = await supabaseClient.from('coaches').select('*');
    if (error) {
      console.error('코치 목록 불러오기 오류:', error);
      return;
    }

    const coachFilter = document.getElementById('coachFilter');
    const modalCoachName = document.getElementById('modalCoachName');

    coachFilter.innerHTML = '<option value="ALL" selected>전체 코치 보기</option>';
    modalCoachName.innerHTML = '';
    coachMap = {};

    (coaches || []).forEach(c => {
      coachMap[c.name] = c.color || '#3788d8';
      coachFilter.innerHTML += `<option value="${c.name}">${c.name}</option>`;
      modalCoachName.innerHTML += `<option value="${c.name}">${c.name}</option>`;
    });

    const coachTableBody = document.getElementById('coachTableBody');
    coachTableBody.innerHTML = '';

    (coaches || []).forEach(c => {
      const branchBadges = (c.branch || '위례점')
        .split(',')
        .map(b => `<span class="badge bg-secondary me-1">${b.trim()}</span>`)
        .join('');

      coachTableBody.innerHTML += `
        <tr>
          <td>${branchBadges}</td>
          <td class="fw-bold">${c.name}</td>
          <td>${c.email}</td>
          <td>${c.role === 'admin' ? '<span class="badge bg-danger">관리자</span>' : '<span class="badge bg-primary">코치</span>'}</td>
          <td><div style="width:20px; height:20px; background-color:${c.color || '#3788d8'}; border-radius:3px;"></div></td>
          <td><button class="btn btn-sm btn-outline-danger" onclick="deleteCoach('${c.id}')">삭제</button></td>
        </tr>
      `;
    });
  }

  async function checkAuthStatus() {
    const { data: { user } } = await supabaseClient.auth.getUser();
    const userInfo = document.getElementById('userInfo');
    const authBtn = document.getElementById('authBtn');
    const manageCoachBtn = document.getElementById('manageCoachBtn');
    const branchSelect = document.getElementById('branchSelect');
    const modalBranch = document.getElementById('modalBranch');

    if (user) {
      const { data: coachData } = await supabaseClient
        .from('coaches')
        .select('*')
        .eq('email', user.email)
        .single();

      userInfo.innerText = coachData ? `${coachData.name} (${coachData.role})` : user.email;
      authBtn.innerText = "로그아웃";
      authBtn.setAttribute("onclick", "handleLogout()");
      authBtn.removeAttribute("data-bs-toggle");

      if (coachData && coachData.role === 'admin') {
        manageCoachBtn.classList.remove('d-none');
      } else if (coachData) {
        manageCoachBtn.classList.add('d-none');
        const assignedBranches = (coachData.branch || '위례점').split(',').map(b => b.trim());
        branchSelect.innerHTML = '';
        modalBranch.innerHTML = '';

        assignedBranches.forEach(branch => {
          branchSelect.innerHTML += `<option value="${branch}">${branch}</option>`;
          modalBranch.innerHTML += `<option value="${branch}">${branch}</option>`;
        });
        calendar.refetchEvents();
      }
    } else {
      userInfo.innerText = "";
      authBtn.innerText = "로그인";
      authBtn.setAttribute("onclick", "");
      authBtn.setAttribute("data-bs-toggle", "modal");
      authBtn.setAttribute("data-bs-target", "#loginModal");
      manageCoachBtn.classList.add('d-none');
    }
  }

  async function handleLogin() {
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
      alert('로그인 실패: ' + error.message);
    } else {
      bootstrap.Modal.getInstance(document.getElementById('loginModal')).hide();
      await checkAuthStatus();
    }
  }

  async function handleLogout() {
    await supabaseClient.auth.signOut();
    location.reload();
  }

  function openAddModal() {
    document.getElementById('modalTitle').innerText = "일정 추가";
    document.getElementById('scheduleId').value = "";
    document.getElementById('modalStudentName').value = "";
    document.getElementById('modalSubject').value = "";
    document.getElementById('modalStartTime').value = "";
    document.getElementById('modalEndTime').value = "";
    document.getElementById('deleteScheduleBtn').classList.add('d-none');
    
    new bootstrap.Modal(document.getElementById('scheduleModal')).show();
  }

  function openEditModal(scheduleData) {
    document.getElementById('modalTitle').innerText = "일정 수정";
    document.getElementById('scheduleId').value = scheduleData.id;
    document.getElementById('modalBranch').value = scheduleData.branch || '위례점';
    document.getElementById('modalStudentName').value = scheduleData.student_name;
    document.getElementById('modalCoachName').value = scheduleData.coach_name;
    document.getElementById('modalSubject').value = scheduleData.subject || '';
    document.getElementById('modalRoomName').value = scheduleData.room_name;
    document.getElementById('modalStartTime').value = scheduleData.start_time.slice(0, 16);
    document.getElementById('modalEndTime').value = scheduleData.end_time.slice(0, 16);

    document.getElementById('deleteScheduleBtn').classList.remove('d-none');
    new bootstrap.Modal(document.getElementById('scheduleModal')).show();
  }

  async function saveSchedule() {
    const id = document.getElementById('scheduleId').value;
    const branch = document.getElementById('modalBranch').value;
    const student_name = document.getElementById('modalStudentName').value;
    const coach_name = document.getElementById('modalCoachName').value;
    const subject = document.getElementById('modalSubject').value;
    const room_name = document.getElementById('modalRoomName').value;
    const start_time = document.getElementById('modalStartTime').value;
    const end_time = document.getElementById('modalEndTime').value;

    if (!student_name || !start_time || !end_time) {
      alert("학생 이름과 시간 항목을 정확히 입력해 주세요.");
      return;
    }

    const payload = { branch, student_name, coach_name, subject, room_name, start_time, end_time };

    let result;
    if (id) {
      result = await supabaseClient.from('schedules').update(payload).eq('id', id);
    } else {
      result = await supabaseClient.from('schedules').insert([payload]);
    }

    if (result.error) {
      alert("저장 실패: " + result.error.message);
    } else {
      bootstrap.Modal.getInstance(document.getElementById('scheduleModal')).hide();
      calendar.refetchEvents();
    }
  }

  async function deleteSchedule() {
    const id = document.getElementById('scheduleId').value;
    if (!id || !confirm("정말 이 일정을 삭제하시겠습니까?")) return;

    const { error } = await supabaseClient.from('schedules').delete().eq('id', id);
    if (error) {
      alert("삭제 실패: " + error.message);
    } else {
      bootstrap.Modal.getInstance(document.getElementById('scheduleModal')).hide();
      calendar.refetchEvents();
    }
  }

  async function registerNewCoach() {
    const checkedBranches = Array.from(document.querySelectorAll('.new-coach-branch:checked')).map(cb => cb.value);
    if (checkedBranches.length === 0) {
      alert('최소 하나 이상의 담당 지점을 선택해 주세요.');
      return;
    }

    const branch = checkedBranches.join(', ');
    const name = document.getElementById('newCoachName').value.trim();
    const email = document.getElementById('newCoachEmail').value.trim();
    const role = document.getElementById('newCoachRole').value;
    const color = document.getElementById('newCoachColor').value;

    if (!name || !email) {
      alert('코치 이름과 이메일을 정확히 입력해 주세요.');
      return;
    }

    const { error } = await supabaseClient.from('coaches').insert([{ branch, name, email, role, color }]);
    if (error) {
      alert('코치 등록 실패: ' + error.message);
    } else {
      alert(`${name} 코치(${branch})가 등록되었습니다.`);
      document.getElementById('newCoachName').value = '';
      document.getElementById('newCoachEmail').value = '';
      await loadCoachesData();
    }
  }

  async function deleteCoach(id) {
    if (!confirm('정말 이 코치 계정을 삭제하시겠습니까?')) return;
    const { error } = await supabaseClient.from('coaches').delete().eq('id', id);
    if (error) {
      alert('삭제 실패: ' + error.message);
    } else {
      await loadCoachesData();
    }
  }
</script>

</body>
</html>
